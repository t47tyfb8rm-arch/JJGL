<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>基金管家</title>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="基金管家">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--red:#e53935;--green:#43a047;--brand:#1a237e;--text:#1a1a2e;--t2:#666;--t3:#aaa;--bg:#f5f5f5;--card:#fff;--r:12px;--shadow:0 1px 3px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.03)}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
body.dark{--bg:#0f0f1a;--card:#1a1a30;--text:#e0e0ec;--t2:#888;--t3:#555;--shadow:0 1px 3px rgba(0,0,0,.3)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}.card:active{opacity:.9}
.up{color:var(--red)}.down{color:var(--green)}
.muted{color:var(--t3);font-size:11px}.t2{color:var(--t2);font-size:12px}
.px{padding-left:12px;padding-right:12px}
.flex{display:flex}.flex-c{display:flex;align-items:center}.flex-b{display:flex;justify-content:space-between;align-items:center}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}
.pb{padding:10px 0}.pt{padding-top:8px}
.fw6{font-weight:600}.fw7{font-weight:700}
.fs12{font-size:12px}.fs13{font-size:13px}.fs14{font-size:14px}.fs15{font-size:15px}.fs17{font-size:17px}.fs18{font-size:18px}.fs20{font-size:20px}.fs24{font-size:24px}.fs26{font-size:26px}
.mt2{margin-top:2px}.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}
.content{width:100%;max-width:480px;margin:0 auto;padding-bottom:88px;padding-top:2px}
.tab-c{display:none}.tab-c.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab-bar{position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.04);display:flex;justify-content:space-evenly;padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
body.dark .tab-bar{background:rgba(18,18,30,.94);border-top-color:rgba(255,255,255,.04)}
.tab-i{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--t3);cursor:pointer;padding:5px 4px;min-width:0;min-height:46px;-webkit-tap-highlight-color:transparent;user-select:none}
.tab-i svg{width:22px;height:22px;color:var(--t3)}.tab-i span{line-height:1.1}
.tab-i.active{color:var(--brand)}.tab-i.active svg{color:var(--brand)}.tab-i.active span{font-weight:600;color:var(--brand)}
.tag{padding:2px 7px;border-radius:3px;font-size:10px;display:inline-block}
.tag-blue{background:rgba(26,35,126,.07);color:var(--brand)}.tag-yellow{background:rgba(255,152,0,.1);color:#ff9800}.tag-red{background:rgba(229,57,53,.08);color:var(--red)}.tag-green{background:rgba(67,160,71,.08);color:var(--green)}
.btn{padding:8px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;background:linear-gradient(135deg,#1a237e,#304ffe);color:#fff;cursor:pointer;width:100%;min-height:36px}
.icon-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';white-space:nowrap}
.asset-main,.asset-side{min-width:0}.asset-main{padding-right:8px}.asset-side{flex-shrink:0}
.metric-grid{gap:4px}.metric-grid>div{min-width:0}
#index-grid>div{min-width:0}
#fund-chips{overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:2px}
#fund-chips::-webkit-scrollbar{display:none}
.fund-chip{min-width:108px;scroll-snap-align:start}
.row-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap-row{min-width:0;flex-wrap:wrap;row-gap:4px}
.benchmark-values{flex-wrap:wrap;row-gap:4px}
.section-h{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font-size:15px;font-weight:800;line-height:1.2}
.section-h:before{content:"";width:4px;height:16px;border-radius:4px;background:var(--brand);display:block}
.tight-card{margin:6px 12px;padding:12px}
.home-title{font-size:18px;font-weight:800;letter-spacing:0}
.asset-card{background:linear-gradient(180deg,var(--card),var(--card));}
.fund-chip{min-height:86px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}.dot-red{background:var(--red)}.dot-green{background:var(--green)}.dot-gray{background:var(--t3)}.dot-yellow{background:#ff9800}
.subtle-btn{width:100%;min-height:34px;border:1px solid rgba(26,35,126,.16);border-radius:8px;background:rgba(26,35,126,.06);color:var(--brand);font-size:13px;font-weight:700}
.buy-primary{background:linear-gradient(135deg,#1a237e,#304ffe);color:#fff;border-color:transparent}
.metric-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;text-align:center;border-top:.5px solid rgba(0,0,0,.05);border-bottom:.5px solid rgba(0,0,0,.05);padding:7px 0}
.metric-strip>div+div{border-left:.5px solid rgba(0,0,0,.05)}
.metric-strip .muted{font-size:10px}.metric-strip .num{font-size:13px;font-weight:800;margin-top:2px}
.ai-card{padding:12px;margin-top:8px}
.ai-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.ai-name{display:flex;align-items:baseline;gap:6px;min-width:0}.ai-code{font-size:16px;font-weight:800}.ai-fund{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-trend{font-size:13px;font-weight:800;margin-top:3px;text-align:right}
.ai-advice{font-size:12px;color:var(--t2);line-height:1.55;margin:8px 0;padding:8px 10px;background:rgba(0,0,0,.025);border-radius:8px}
.ai-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.perf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:7px;border-top:.5px solid rgba(0,0,0,.04);font-size:11px;text-align:center}
.perf-row span{display:block}.perf-row .muted{font-size:10px}
.accuracy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.accuracy-grid>div{padding:8px;border-radius:8px;background:rgba(0,0,0,.025);text-align:center}
.buy-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 0;border-top:.5px solid rgba(0,0,0,.04);font-size:13px}
.buy-row:first-child{border-top:none}.buy-status{font-weight:800}
.profile-hero{padding:16px 12px 8px}.profile-avatar{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,#1a237e,#304ffe);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:17px;color:#fff;font-weight:800}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.summary-grid>div{padding:9px 6px;border-radius:8px;background:rgba(0,0,0,.025);text-align:center}
.summary-grid .muted{font-size:10px}.summary-grid .num{font-size:14px;font-weight:800;margin-top:2px}
@media (max-width:390px){
  :root{--r:10px}
  .px{padding-left:10px;padding-right:10px}
  .fs26{font-size:23px}.fs20{font-size:18px}.fs18{font-size:17px}.fs17{font-size:16px}.fs16{font-size:15px}
  .card{border-radius:10px}
  .content{padding-bottom:84px}
  .tab-i{font-size:9px;min-height:44px}
  .tab-i svg{width:20px;height:20px}
  .asset-card{padding:14px 10px!important;margin-left:10px!important;margin-right:10px!important}
  .asset-card>.flex-b{align-items:flex-start}
  .fund-chip{min-width:104px;padding:8px 4px!important;min-height:80px}
  .tight-card{margin-left:10px!important;margin-right:10px!important;padding:11px!important}
  .section-h{padding-left:10px;padding-right:10px}
}
@media (max-width:340px){
  .fs26{font-size:21px}.fs20{font-size:16px}.fs15{font-size:14px}
  .muted{font-size:10px}
  .fund-chip{min-width:96px}
  #index-grid .fs16{font-size:14px}
}
</style>
</head>
<body>
<div class="content">

<!-- ===== HOME ===== -->
<div id="thome" class="tab-c active">

<div class="px" style="padding-top:8px;padding-bottom:4px">
  <div class="flex-b">
    <div class="home-title">基金管家</div>
    <div class="flex-c gap4">
      <span class="muted" id="clock-display">09:40</span>
      <span class="icon-btn" onclick="fetchD()"><svg width="16" height="16" viewBox="0 0 24 24" style="color:var(--t3);cursor:pointer"><path d="M23 4v6h-6M1 20v-6h6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <span class="icon-btn" onclick="toggleDark()"><svg width="18" height="18" viewBox="0 0 24 24" style="color:var(--t3);cursor:pointer"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
    </div>
  </div>
  <div class="muted" style="margin-top:2px" id="header-time">2026-07-24 11:29</div>
</div>

<!-- 总资产卡片 -->
<div class="card px asset-card" style="margin:4px 12px;padding:16px 12px">
  <div class="flex-b">
    <div class="asset-main"><div class="muted" style="margin-bottom:1px">总资产</div><div class="fs26 fw7 num" id="total-asset" style="letter-spacing:-.5px">¥--</div></div>
    <div class="asset-side" style="text-align:right"><div class="muted" style="margin-bottom:1px">今日收益</div><div class="fs20 fw7 num" id="today-profit" style="color:var(--red)">--</div></div>
  </div>
  <div class="flex metric-grid" style="margin-top:10px;padding-top:10px;border-top:.5px solid rgba(0,0,0,.04)">
    <div style="flex:1"><div class="muted" style="font-size:10px">总收益率</div><div class="fs15 fw7 mt2" id="total-yield" style="color:var(--red)">--</div></div>
    <div style="flex:1;text-align:center"><div class="muted" style="font-size:10px">持有基金</div><div class="fs15 fw7 mt2" id="holding-count">--</div></div>
    <div style="flex:1;text-align:right"><div class="muted" style="font-size:10px">持有天数</div><div class="fs15 fw7 mt2" id="hold-days">--</div></div>
  </div>
  <div style="margin-top:8px;height:3px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden">
    <div id="yield-bar" style="height:100%;border-radius:2px;background:linear-gradient(90deg,#43a047,#ff9800,#e53935);width:0%"></div>
  </div>
</div>

<!-- 指数三列 -->
<div class="card" style="margin:4px 12px;overflow:hidden">
  <div class="flex" id="index-grid">
    <div style="flex:1;padding:8px 0;text-align:center"><div class="muted">上证指数</div><div class="fs16 fw7 mt2 num" id="idx-0-price">--</div><div class="fs13 fw7 mt2 down num" id="idx-0-chg">--</div></div>
    <div style="flex:1;padding:8px 0;text-align:center;border-left:.5px solid rgba(0,0,0,.04)"><div class="muted">科创50</div><div class="fs16 fw7 mt2 num" id="idx-1-price">--</div><div class="fs13 fw7 mt2 num" id="idx-1-chg">--</div></div>
    <div style="flex:1;padding:8px 0;text-align:center;border-left:.5px solid rgba(0,0,0,.04)"><div class="muted">国债指数</div><div class="fs16 fw7 mt2 num" id="idx-2-price">--</div><div class="fs13 fw7 mt2 num" id="idx-2-chg">--</div></div>
  </div>
</div>

<!-- 基金三列卡片（参考图风格） -->
<div class="flex gap6" style="padding:0 12px;margin-top:6px" id="fund-chips"></div>

<!-- 排行 -->
<div class="card px tight-card">
  <div class="flex-c" style="padding:2px 0 7px;font-size:14px;font-weight:800;gap:6px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/></svg>今日排行
  </div>
  <div id="rank-list"></div>
  <div style="height:6px"></div>
</div>

<!-- 资讯 -->
<div class="card px tight-card">
  <div class="flex-c" style="padding:2px 0 7px;font-size:14px;font-weight:800;gap:6px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>市场资讯
  </div>
  <div id="news-list"><div class="t2 pb">加载中...</div></div>
</div>
</div>

<!-- ===== FUNDS ===== -->
<div id="tfunds" class="tab-c">
  <div class="section-h">基金详情</div>
  <div id="fund-detail-list"></div>
</div>

<!-- ===== AI ===== -->
<div id="tai" class="tab-c">
  <div class="section-h">AI 综合分析</div>
  <div class="card px tight-card">
    <div id="ai-content"><div class="t2 pb">加载中...</div></div>
    <div style="margin-top:10px;padding-top:10px;border-top:.5px solid rgba(0,0,0,.04)">
      <div class="muted" style="margin-bottom:6px">模型准确度 近7日</div>
      <div class="accuracy-grid" id="accuracy-grid">
        <div><div class="fs18 fw7">--</div><div class="muted">MAE</div></div>
        <div><div class="fs18 fw7">--</div><div class="muted">方向胜率</div></div>
        <div><div class="fs18 fw7">--</div><div class="muted">样本数</div></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== BUY ===== -->
<div id="tbuy" class="tab-c">
  <div class="card px tight-card" style="margin-top:10px">
    <div class="flex-c" style="font-size:14px;font-weight:800;gap:6px;padding-bottom:8px">基金买点状态</div>
    <div id="buy-signals"><div class="t2 pb">加载中...</div></div>
  </div>
  <div class="card px tight-card">
    <div class="flex-c" style="font-size:14px;font-weight:800;gap:6px;padding-bottom:8px">历史收益基准</div>
    <div id="profit-benchmark"><div class="t2 pb">加载中...</div></div>
  </div>
</div>

<!-- ===== PROFILE ===== -->
<div id="tprofile" class="tab-c">
  <div class="profile-hero" style="text-align:center">
    <div class="profile-avatar">基</div>
    <div style="font-size:15px;font-weight:800">基金管家用户</div>
    <div class="muted">v3.0</div>
  </div>
  <div class="card px tight-card">
    <div class="summary-grid">
      <div><div class="muted">总投入</div><div class="num" id="profile-invest">--</div></div>
      <div><div class="muted">总市值</div><div class="num" id="profile-value">--</div></div>
      <div><div class="muted">总收益</div><div class="num" id="profile-profit">--</div></div>
    </div>
    <div style="font-size:13px;font-weight:800;margin-bottom:8px">我的持仓</div>
    <div id="profile-holdings"></div>
  </div>
  <div class="card px tight-card">
    <div class="flex-c flex-b" style="padding:4px 0"><span style="font-size:12px">深色模式</span><span id="dark-tog" onclick="toggleDark()" style="position:relative;width:40px;height:22px;border-radius:11px;background:#ddd;cursor:pointer;flex-shrink:0;transition:.2s"><span style="position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)"></span></span></div>
    <div class="flex-c flex-b" style="padding:4px 0;margin-top:6px"><span style="font-size:12px">版本</span><span class="muted" style="font-size:11px">v3.0.0</span></div>
  </div>
</div>
</div><!-- /content -->

<!-- ===== Tab Bar ===== -->
<div class="tab-bar">
  <div class="tab-i active" data-t="home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>首页</span>
  </div>
  <div class="tab-i" data-t="funds">
    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="17 6 23 6 23 12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>基金</span>
  </div>
  <div class="tab-i" data-t="ai">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16l-6.4 5.2L8 14l-6-4.8h7.6L12 2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>AI</span>
  </div>
  <div class="tab-i" data-t="buy">
    <svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>买点</span>
  </div>
  <div class="tab-i" data-t="profile">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>我的</span>
  </div>
</div>

<script>
const API='';const INT=30000;
document.querySelectorAll('.tab-i').forEach(e=>{e.addEventListener('click',()=>{
  document.querySelectorAll('.tab-i').forEach(t=>t.classList.remove('active'));
  e.classList.add('active');
  document.querySelectorAll('.tab-c').forEach(c=>c.classList.remove('active'));
  document.getElementById('t'+e.dataset.t).classList.add('active');
})});
function toggleDark(){document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');localStorage.setItem('v3-theme',d?'dark':'light');const k=document.querySelector('#dark-tog span');if(k)k.style.left=d?'20px':'2px';const p=document.querySelector('#dark-tog');if(p)p.style.background=d?'#304ffe':'#ddd'}
if(localStorage.getItem('v3-theme')==='dark'){document.body.classList.add('dark')}
function fmt(n){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fp(n){return (n>=0?'+':'')+Number(n).toFixed(2)+'%'}
function cl(n){return n>0?'up':n<0?'down':''}
function cc(n){return n>0?'var(--red)':n<0?'var(--green)':'var(--t3)'}
function shortName(f,n=8){return (f.name||f.code||'').replace(/联接C|增强C|债券C/g,'').substring(0,n)}
function dot(n){return n>0?'dot-red':n<0?'dot-green':'dot-gray'}
function stateDot(s){return s==='buy'?'dot-yellow':s==='hold'?'dot-red':'dot-gray'}
function cleanTrend(s){return (s||'--').replace(/[^\u4e00-\u9fa5A-Za-z0-9%().（）+\-\s]/g,'').trim()||'--'}

async function fetchD(){
  try{
    const r=await fetch(API+'/api/portfolio');
    const d=await r.json();
    document.getElementById('header-time').textContent=d.date+' '+d.time;
    renderHome(d);renderFunds(d);renderAI(d);renderBuy(d);renderProfile(d);
  }catch(e){console.error(e)}
}

function renderHome(d){
  const fs=d.funds||[];let ti=0,tv=0,hc=0,md=0,dp=0;
  fs.forEach(f=>{
    const b=f.buy_point||{};
    if(b.is_holding){
      hc++;ti+=b.cost_nav||0;tv+=f.current_nav||0;
      if((b.hold_days||0)>md)md=b.hold_days;
      // 当日预估收益：用模型预估涨跌幅
      const est=f.ai_prediction?.model_estimated_change||f.estimated_change||0;
      dp+=(f.current_nav||0)*(est/100);
    }
  });
  const tp=tv-ti,yp=ti>0?tp/ti*100:0;
  document.getElementById('total-asset').textContent=tv>0?'¥'+fmt(tv):'¥--';
  document.getElementById('today-profit').textContent=(dp>=0?'+¥':'-¥')+fmt(Math.abs(dp));
  document.getElementById('today-profit').style.color=dp>=0?'var(--red)':'var(--green)';
  document.getElementById('total-yield').textContent=fp(yp);
  document.getElementById('total-yield').style.color=yp>=0?'var(--red)':'var(--green)';
  document.getElementById('holding-count').textContent=hc+'/'+fs.length;
  document.getElementById('hold-days').textContent=md+'天';
  const bw=Math.min(Math.max((yp+20)/40*100,0),100);
  document.getElementById('yield-bar').style.width=bw+'%';
  
  // Index
  const idx=d.index||{};
  const iprice=idx.current?fmt(idx.current):'--';const ichg=idx.daily_change||0;
  document.getElementById('idx-0-price').textContent=iprice;
  document.getElementById('idx-0-chg').textContent=fp(ichg);
  document.getElementById('idx-0-chg').className='fs13 fw7 mt2 num '+cl(ichg);
  
  // Fund chips - 三列
  const cr=document.getElementById('fund-chips');
  cr.innerHTML=fs.map(f=>{
    const b=f.buy_point||{};
    // 用预估涨跌替代昨日涨跌（如果在交易时段）
    const est=f.ai_prediction?.model_estimated_change||f.estimated_change||0;
    const cg=est!==0?est:f.daily_change||0;
    const isEst=est!==0 || f.estimated_change!==0;
    const y=b.is_holding?b.yield_pct:null;
    return '<div class="card fund-chip" style="flex:1;padding:8px 4px;text-align:center;cursor:pointer" onclick="goTab(\'funds\')">'+
      '<div class="muted" style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+f.code+'</div>'+
      '<div class="fs16 fw7 num '+cl(cg)+'" style="margin-top:2px">'+(isEst?'估 ':'')+fp(cg)+'</div>'+
      '<div class="num" style="font-size:12px;font-weight:700;margin-top:3px;color:'+(y!==null?(y>=0?'var(--red)':'var(--green)'):'var(--t3)')+'">'+(y!==null?fp(y):'未持仓')+'</div>'+
      '<div style="font-size:9px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+shortName(f,8)+'</div></div>';
  }).join('');
  
  // Ranking
  const s=[...fs].sort((a,b)=>(b.daily_change||0)-(a.daily_change||0));
  const m=['<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#e53935;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">1</span>',
    '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#f39c12;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">2</span>',
    '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#bbb;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">3</span>'];
  document.getElementById('rank-list').innerHTML=s.map((f,i)=>
    '<div class="flex-c" style="padding:7px 0;font-size:13px;border-top:'+(i>0?'.5px solid rgba(0,0,0,.03)':'none')+'">'+
    '<span style="width:18px;text-align:center;flex-shrink:0">'+(m[i]||(i+1))+'</span>'+
    '<span class="row-title" style="flex:1;margin-left:6px">'+f.code+' '+shortName(f,9)+'</span>'+
    '<span class="num '+cl(f.daily_change)+'" style="font-weight:600">'+fp(f.daily_change)+'</span></div>'
  ).join('');
  
  // News
  const nl=document.getElementById('news-list');
  if(d.news&&d.news.length>0){
    nl.innerHTML=d.news.slice(0,3).map(n=>
      '<div style="padding:8px 0;border-top:.5px solid rgba(0,0,0,.03)">'+
      '<div style="font-size:12px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+(n.title||n.text||'')+'</div>'+
      '<div class="muted" style="margin-top:3px">'+(n.date||n.time||'刚刚')+'</div></div>'
    ).join('');
  }
}

function renderFunds(d){
  const list=document.getElementById('fund-detail-list');if(!d.funds)return;
  list.innerHTML=d.funds.map(f=>{
    const bp=f.buy_point||{},cg=f.daily_change||0,r7=f.return_7d,r1=f.return_1m;
    const risk=f.ai_prediction?.risk_level||'中';
    const rsk='<span class="tag '+(risk==='高'?'tag-red':'tag-yellow')+'">风险'+risk+'</span>';
    return '<div class="card px tight-card">'+
      '<div class="flex-b" style="margin-bottom:4px;gap:8px">'+
        '<div class="row-title"><span style="font-size:12px;color:var(--t2)">'+f.code+'</span><span style="font-size:15px;font-weight:800;margin-left:6px">'+shortName(f,10)+'</span></div>'+rsk+
      '</div>'+
      '<div class="flex-b" style="margin-bottom:6px">'+
        '<span class="fs20 fw7 num">'+(f.current_nav?fmt(f.current_nav):'--')+'</span>'+
        '<span class="fs17 fw7 num '+cl(cg)+'">'+fp(cg)+'</span>'+
      '</div>'+
      '<div class="metric-strip">'+
        '<div><div class="muted">持有收益</div><div class="num" style="color:'+(bp.is_holding?(bp.yield_pct>=0?'var(--red)':'var(--green)'):'var(--t3)')+'">'+(bp.is_holding?fp(bp.yield_pct||0):'未持仓')+'</div></div>'+
        '<div><div class="muted">7日</div><div class="num" style="color:'+cc(r7)+'">'+(r7!=null?fp(r7):'--')+'</div></div>'+
        '<div><div class="muted">1月</div><div class="num" style="color:'+cc(r1)+'">'+(r1!=null?fp(r1):'--')+'</div></div>'+
      '</div>'+
      (bp.is_holding?
        '<div class="flex-b" style="font-size:11px;margin:6px 0 5px">'+
          '<span class="muted num">成本 '+fmt(bp.cost_nav||0)+'</span><span class="muted">持有'+(bp.hold_days||0)+'天</span>'+
          '<span class="num" style="font-weight:600;color:'+cc(bp.yield_pct||0)+'">'+fp(bp.yield_pct||0)+'</span>'+
        '</div>'+
        (bp.target_nav?'<div style="margin-bottom:4px"><div class="flex-b" style="font-size:10px"><span class="muted">目标 '+fmt(bp.target_nav)+'</span><span class="muted">进度'+(bp.progress_pct||0).toFixed(0)+'%</span></div><div style="height:2px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden"><div style="height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--red));width:'+Math.min((bp.progress_pct||0),100)+'%"></div></div></div>':'')+
        '<button class="subtle-btn" onclick="alert(\'买入功能即将推出\')">记录买入</button>'
      :'<div class="muted" style="font-size:12px;padding:7px 0 1px">未持仓</div>')+
    '</div>';
  }).join('');
}

function renderAI(d){
  const fs=d.funds||[];if(!fs.length)return;
  document.getElementById('ai-content').innerHTML=fs.map((f,i)=>{
    const ai=f.ai_prediction||{};
    // 涨跌幅：优先预估，其次模型，最后昨日
    const est=f.estimated_change||f.model_estimated_change||0;
    const cg=est!==0?est:(f.daily_change||0);
    const r7=f.return_7d,r1=f.return_1m,r3=f.return_3m,r6=f.return_6m;
    return '<div class="card ai-card" style="margin-top:'+(i>0?'8px':'0')+'">'+
      '<div class="ai-head">'+
        '<div class="ai-name"><span class="ai-code">'+f.code+'</span><span class="ai-fund">'+(f.name||'').replace(/C$/,'')+'</span></div>'+
        '<div><div class="fs16 fw7 num '+cl(cg)+'" style="text-align:right">'+fp(cg)+'</div><div class="ai-trend">'+cleanTrend(ai.trend)+'</div></div>'+
      '</div>'+
      '<div class="ai-advice">'+(ai.advice||'暂无分析')+'</div>'+
      '<div class="ai-tags">'+
        '<span class="tag tag-blue">估值'+(ai.valuation_position||'--')+'</span>'+
        '<span class="tag tag-yellow">置信'+(ai.confidence||'--')+'</span>'+
        '<span class="tag tag-red">风险'+(ai.risk_level||'--')+'</span>'+
        (ai.key_levels?'<span class="tag tag-blue">支撑'+(ai.key_levels.split('/')[0]||'').replace('支撑','').trim()+'</span>':'')+
        (ai.key_levels?'<span class="tag tag-blue">压力'+(ai.key_levels.split('/')[1]||'').replace('压力','').trim()+'</span>':'')+
      '</div>'+
      '<div class="perf-row">'+
        '<div><span class="muted">7日</span><span class="num" style="color:'+cc(r7)+'">'+(r7!=null?fp(r7):'--')+'</span></div>'+
        '<div><span class="muted">1月</span><span class="num" style="color:'+cc(r1)+'">'+(r1!=null?fp(r1):'--')+'</span></div>'+
        '<div><span class="muted">3月</span><span class="num" style="color:'+cc(r3)+'">'+(r3!=null?fp(r3):'--')+'</span></div>'+
        '<div><span class="muted">6月</span><span class="num" style="color:'+cc(r6)+'">'+(r6!=null?fp(r6):'--')+'</span></div>'+
      '</div>'+
    '</div>';
  }).join('');
  
  // Accuracy
  fetch(API+'/api/model-accuracy?days=7').then(r=>r.json()).then(d2=>{
    const v=Object.values(d2||{});
    if(v.length>0){
      const o=v[0]||{};
      document.getElementById('accuracy-grid').innerHTML=
        '<div><div class="fs18 fw7">'+(o.mae!=null?o.mae.toFixed(2):'--')+'</div><div class="muted">MAE</div></div>'+
        '<div><div class="fs18 fw7">'+(o.win_rate!=null?(o.win_rate*100).toFixed(0)+'%':'--')+'</div><div class="muted">方向胜率</div></div>'+
        '<div><div class="fs18 fw7">'+(o.sample_count!=null?o.sample_count:'--')+'</div><div class="muted">样本数</div></div>';
    }
  }).catch(()=>{});
}

function renderBuy(d){
  const fs=d.funds||[];
  document.getElementById('buy-signals').innerHTML=fs.map(f=>{
    const bp=f.buy_point||{},cb=bp.can_buy||false,hd=bp.is_holding||false,p=bp.yield_pct||0;
    const state=hd?'hold':(cb?'buy':'none');
    const label=hd?'持有中':(cb?'可关注':'未到位');
    const value=hd?fp(p):(cb?'购买信号':bp.drop_pct?'距买点 '+bp.drop_pct+'%':'无信号');
    return '<div class="buy-row">'+
      '<span class="status-dot '+stateDot(state)+'"></span>'+
      '<div class="row-title"><span class="num" style="font-weight:800">'+f.code+'</span><span style="margin-left:6px">'+shortName(f,10)+'</span><div class="muted" style="margin-top:1px">'+label+'</div></div>'+
      '<span class="num buy-status" style="color:'+(hd?(p>=0?'var(--red)':'var(--green)'):(cb?'#ff9800':'var(--t3)'))+'">'+value+'</span></div>';
  }).join('');
  
  document.getElementById('profit-benchmark').innerHTML=fs.map(f=>{
    const r7=f.return_7d,r1=f.return_1m,r3=f.return_3m,r6=f.return_6m;
    return '<div style="padding:9px 0;border-top:.5px solid rgba(0,0,0,.04)">'+
      '<div class="row-title" style="font-size:13px;font-weight:800;margin-bottom:6px">'+f.code+' '+shortName(f,10)+'</div>'+
      '<div class="perf-row" style="border-top:none;padding-top:0">'+
        '<div><span class="muted">7日</span><span class="num" style="color:'+cc(r7)+'">'+(r7!=null?fp(r7):'--')+'</span></div>'+
        '<div><span class="muted">1月</span><span class="num" style="color:'+cc(r1)+'">'+(r1!=null?fp(r1):'--')+'</span></div>'+
        '<div><span class="muted">3月</span><span class="num" style="color:'+cc(r3)+'">'+(r3!=null?fp(r3):'--')+'</span></div>'+
        '<div><span class="muted">6月</span><span class="num" style="color:'+cc(r6)+'">'+(r6!=null?fp(r6):'--')+'</span></div>'+
      '</div></div>';
  }).join('');
}

function renderProfile(d){
  const fs=d.funds||[];let ti=0,tv=0;
  document.getElementById('profile-holdings').innerHTML=fs.map(f=>{
    const bp=f.buy_point||{};
    if(bp.is_holding){ti+=bp.cost_nav||0;tv+=f.current_nav||0}
    const state=bp.is_holding?'hold':'none';
    return '<div class="buy-row">'+
      '<span class="status-dot '+stateDot(state)+'"></span>'+
      '<div class="row-title"><span class="num" style="font-weight:800">'+f.code+'</span><span style="margin-left:6px">'+shortName(f,10)+'</span></div>'+
      '<span class="num buy-status" style="color:'+(bp.is_holding?(bp.yield_pct>=0?'var(--red)':'var(--green)'):'var(--t3)')+'">'+(bp.is_holding?fp(bp.yield_pct||0):'未持仓')+'</span></div>';
  }).join('');
  const tp=tv-ti;
  document.getElementById('profile-invest').textContent=ti>0?'¥'+fmt(ti):'¥0.00';
  document.getElementById('profile-value').textContent=tv>0?'¥'+fmt(tv):'¥0.00';
  document.getElementById('profile-profit').textContent=tp>=0?'+¥'+fmt(tp):'-¥'+fmt(Math.abs(tp));
  document.getElementById('profile-profit').style.color=tp>=0?'var(--red)':'var(--green)';
}

function goTab(n){
  document.querySelectorAll('.tab-i').forEach(t=>t.classList.remove('active'));
  const el=document.querySelector('[data-t="'+n+'"]');if(el)el.classList.add('active');
  document.querySelectorAll('.tab-c').forEach(c=>c.classList.remove('active'));
  const ce=document.getElementById('t'+n);if(ce)ce.classList.add('active');
}

fetchD();setInterval(fetchD,INT);
function updateClock(){document.getElementById('clock-display').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
updateClock();setInterval(updateClock,10000);
</script>
</body>
</html>
