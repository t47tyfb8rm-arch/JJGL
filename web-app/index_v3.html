<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>基金管家</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="基金管家">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png?v=2">
<link rel="icon" type="image/png" href="/static/icon-180.png?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--brand:#1a237e;--up:#e53935;--down:#43a047;--up-bg:rgba(229,57,53,0.08);--down-bg:rgba(67,160,71,0.08);--neutral:#333;--text2:#666;--text3:#aaa;--bg:#f5f5f5;--card:#fff;--radius:14px;--shadow:0 1px 4px rgba(0,0,0,0.04),0 2px 12px rgba(0,0,0,0.04);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--neutral);min-height:100vh;-webkit-font-smoothing:antialiased}
body.dark{--bg:#12121f;--card:#1e1e35;--neutral:#e8e8f0;--text2:#999;--text3:#666;--shadow:0 1px 4px rgba(0,0,0,0.3)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .2s}
.card:active{transform:scale(.985)}
.up{color:var(--up)}.down{color:var(--down)}
.muted{color:var(--text3);font-size:12px}
.section{padding:0 16px;margin-top:10px}
.section-title{font-size:14px;font-weight:600;color:var(--neutral);padding:14px 0 10px;display:flex;align-items:center;gap:6px}
.grid-3{display:flex;gap:0}
.grid-3>div{flex:1;padding:10px 0;text-align:center}
.grid-3>div+div{border-left:.5px solid rgba(0,0,0,.05)}
body.dark .grid-3>div+div{border-left-color:rgba(255,255,255,.06)}
.fw7{font-weight:700}.fs14{font-size:14px}.fs16{font-size:16px}.fs18{font-size:18px}.fs24{font-size:24px}.fs26{font-size:26px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.content{padding-bottom:80px;padding-top:4px}
.tab-content{display:none}.tab-content.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:.5px solid rgba(0,0,0,.05);display:flex;justify-content:space-around;align-items:flex-start;padding-top:6px;padding-bottom:max(4px,env(safe-area-inset-bottom))}
body.dark .tab-bar{background:rgba(26,26,46,.96);border-top-color:rgba(255,255,255,.05)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text3);cursor:pointer;transition:color .2s;padding:2px 14px;min-width:44px}
.tab-item svg{width:24px;height:24px;transition:transform .2s}
.tab-item span{line-height:1;transition:font-weight .2s}
.tab-item.active{color:var(--brand)}
.tab-item.active svg{transform:scale(1.05)}
.tab-item.active span{font-weight:600}
</style>
</head>
<body>
<div class="content">

<!-- HOME -->
<div id="tab-home" class="tab-content active">

<div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--bg)">
  <div>
    <div style="font-size:17px;font-weight:600">基金管家</div>
    <div class="muted" id="header-time" style="margin-top:2px">2026-07-24 09:40</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:12px;color:var(--text3)" id="clock-display">09:40</span>
    <svg width="20" height="20" viewBox="0 0 24 24" onclick="toggleDark()" style="cursor:pointer;color:var(--text3)">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </svg>
  </div>
</div>

<div class="card" style="margin:8px 16px;padding:18px 16px">
  <div class="flex-between">
    <div><div class="muted" style="margin-bottom:2px;font-size:12px">总资产</div><div class="fs26 fw7" id="total-asset">--</div></div>
    <div style="text-align:right"><div class="muted" style="margin-bottom:2px;font-size:12px">今日收益</div><div class="fs18 fw7" id="today-profit" style="color:var(--up)">--</div></div>
  </div>
  <div class="flex gap20" style="margin-top:12px;padding-top:12px;border-top:.5px solid rgba(0,0,0,.04)">
    <div><div class="muted" style="font-size:11px">总收益率</div><div class="fs14 fw7 mt4" id="total-yield" style="color:var(--up)">--</div></div>
    <div><div class="muted" style="font-size:11px">持有基金</div><div class="fs14 fw7 mt4" id="holding-count">--</div></div>
    <div><div class="muted" style="font-size:11px">持有天数</div><div class="fs14 fw7 mt4" id="hold-days">--</div></div>
  </div>
  <div style="margin-top:10px;height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden">
    <div id="yield-bar" style="height:100%;border-radius:2px;background:linear-gradient(90deg,#43a047,#ff9800,#e53935);width:0%;transition:width .6s"></div>
  </div>
</div>

<div class="card" style="margin:8px 16px;overflow:hidden">
  <div class="grid-3" id="index-grid">
    <div><div class="muted">上证指数</div><div class="fs16 fw7 mt4" style="font-feature-settings:'tnum'">--</div><div class="fs14 fw7 mt4 down">--</div></div>
    <div><div class="muted">科创50</div><div class="fs16 fw7 mt4" style="font-feature-settings:'tnum'">--</div><div class="fs14 fw7 mt4">--</div></div>
    <div><div class="muted">国债指数</div><div class="fs16 fw7 mt4" style="font-feature-settings:'tnum'">--</div><div class="fs14 fw7 mt4">--</div></div>
  </div>
</div>

<div class="flex gap8" style="padding:0 16px;margin-top:10px" id="fund-chips"></div>

<div class="card section" style="padding:0 16px">
  <div class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/></svg>今日排行</div>
  <div id="rank-list"></div>
</div>

<div class="card" style="margin:10px 16px;padding:0 16px">
  <div class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>市场资讯</div>
  <div id="news-list"><div style="padding:10px 0;font-size:13px;color:var(--text3)">加载中...</div></div>
</div>
</div>

<!-- FUNDS -->
<div id="tab-funds" class="tab-content">
  <div id="fund-detail-list"></div>
</div>

<!-- AI -->
<div id="tab-ai" class="tab-content">
  <div class="section"><div class="section-title">🤖 AI 综合分析</div></div>
  <div class="card" style="margin:0 16px;padding:16px">
    <div class="flex gap8" id="ai-tabs" style="margin-bottom:12px"></div>
    <div id="ai-content"><div class="muted" style="font-size:13px">加载中...</div></div>
    <div style="margin-top:12px;padding-top:12px;border-top:.5px solid rgba(0,0,0,.04)">
      <div class="muted" style="margin-bottom:8px;font-size:12px">📐 模型准确度 近 7 日</div>
      <div class="flex gap16" id="ai-accuracy">
        <div><div class="fs18 fw7">--</div><div class="muted">MAE</div></div>
        <div><div class="fs18 fw7">--</div><div class="muted">方向胜率</div></div>
        <div><div class="fs18 fw7">--</div><div class="muted">样本数</div></div>
      </div>
    </div>
  </div>
  <div class="card" style="margin:10px 16px;padding:16px">
    <div class="section-title" style="padding:0;margin-bottom:10px">💰 基金买点状态</div>
    <div id="buy-signals"><div class="muted" style="font-size:13px">加载中...</div></div>
  </div>
  <div class="card" style="margin:10px 16px;padding:16px">
    <div class="section-title" style="padding:0;margin-bottom:10px">📊 历史收益基准</div>
    <div id="profit-benchmark"><div class="muted" style="font-size:13px">加载中...</div></div>
  </div>
</div>

<!-- no search tab -->

<!-- PROFILE -->
<div id="tab-profile" class="tab-content">
  <div style="text-align:center;padding:24px 16px 12px">
    <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1a237e,#304ffe);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:20px;color:#fff;font-weight:600">基</div>
    <div style="font-size:16px;font-weight:600">基金管家用户</div>
    <div class="muted" style="margin-top:2px">v3.0</div>
  </div>
  <div class="card" style="margin:8px 16px;padding:16px">
    <div style="font-size:14px;font-weight:600;margin-bottom:10px">📊 我的持仓</div>
    <div id="profile-holdings"></div>
    <div style="margin-top:10px;padding-top:10px;border-top:.5px solid rgba(0,0,0,.04)">
      <div class="flex-between" style="font-size:13px;padding:3px 0"><span class="muted">总投入</span><span class="fw7" id="profile-invest">--</span></div>
      <div class="flex-between" style="font-size:13px;padding:3px 0;margin-top:4px"><span class="muted">总市值</span><span class="fw7" id="profile-value">--</span></div>
      <div class="flex-between" style="font-size:13px;padding:3px 0;margin-top:4px"><span class="muted">总收益</span><span class="fw7" id="profile-profit">--</span></div>
    </div>
  </div>
  <div class="card" style="margin:8px 16px;padding:16px">
    <div class="flex-between" style="padding:4px 0"><span style="font-size:13px">🌙 深色模式</span><span id="dark-toggle" onclick="toggleDark()" style="position:relative;width:44px;height:24px;border-radius:12px;background:#ddd;cursor:pointer;transition:.2s"><span style="position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></span></span></div>
    <div class="flex-between" style="padding:4px 0;margin-top:8px"><span style="font-size:13px">版本</span><span class="muted" style="font-size:12px">v3.0.0</span></div>
  </div>
</div>

</div><!-- /content -->

<div class="tab-bar">
  <div class="tab-item active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>首页</span>
  </div>
  <div class="tab-item" data-tab="funds">
    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="17 6 23 6 23 12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>基金</span>
  </div>
  <div class="tab-item" data-tab="ai">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16l-6.4 5.2L8 14l-6-4.8h7.6L12 2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>AI</span>
  </div>
  <!-- no search tab -->
  <div class="tab-item" data-tab="profile">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>我的</span>
  </div>
</div>

<script>
// Config
const API_BASE = '';
const REFRESH_INTERVAL = 30000;

// Tab switching
document.querySelectorAll('.tab-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + item.dataset.tab).classList.add('active');
  });
});

// Dark mode
function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('v3-theme', isDark ? 'dark' : 'light');
  const knob = document.querySelector('#dark-toggle span');
  if (knob) knob.style.left = isDark ? '22px' : '2px';
  const parent = document.querySelector('#dark-toggle');
  if (parent) parent.style.background = isDark ? '#304ffe' : '#ddd';
}
if (localStorage.getItem('v3-theme') === 'dark') { document.body.classList.add('dark'); }

// Formatters
function fmt(n) { return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function fmtPct(n) { return (n>=0?'+':'')+Number(n).toFixed(2)+'%' }
function cls(n) { return n>0?'up':n<0?'down':'' }

// Fetch
async function fetchData() {
  try {
    const r = await fetch(API_BASE + '/api/portfolio');
    const d = await r.json();
    document.getElementById('header-time').textContent = d.date + ' ' + d.time;
    renderHome(d);
    renderFunds(d);
    renderAI(d);
    renderProfile(d);
  } catch(e) { console.error(e) }
}

// ===== Render Home =====
function renderHome(d) {
  const funds = d.funds || [];
  let totalInvest = 0, totalValue = 0, holdCount = 0, maxDays = 0;
  funds.forEach(f => {
    const bp = f.buy_point || {};
    if (bp.is_holding) {
      holdCount++;
      totalInvest += bp.cost_nav || 0;
      totalValue += f.current_nav || 0;
      if ((bp.hold_days || 0) > maxDays) maxDays = bp.hold_days;
    }
  });
  const profit = totalValue - totalInvest;
  const yieldPct = totalInvest > 0 ? (profit / totalInvest * 100) : 0;

  document.getElementById('total-asset').textContent = totalValue > 0 ? '\u00a5' + fmt(totalValue) : '\u00a5--';
  document.getElementById('today-profit').textContent = profit >= 0 ? '+\u00a5' + fmt(profit) : '-\u00a5' + fmt(Math.abs(profit));
  document.getElementById('today-profit').style.color = profit >= 0 ? 'var(--up)' : 'var(--down)';
  document.getElementById('total-yield').textContent = fmtPct(yieldPct);
  document.getElementById('total-yield').style.color = yieldPct >= 0 ? 'var(--up)' : 'var(--down)';
  document.getElementById('holding-count').textContent = holdCount + ' / ' + funds.length;
  document.getElementById('hold-days').textContent = maxDays + '\u5929';
  const barW = Math.min(Math.max((yieldPct + 20) / 40 * 100, 0), 100);
  document.getElementById('yield-bar').style.width = barW + '%';

  // Index
  const idx = d.index || {};
  document.querySelectorAll('#index-grid > div').forEach((el, i) => {
    const items = [
      { name: '\u4e0a\u8bc1\u6307\u6570', price: idx.current ? fmt(idx.current) : '--', chg: idx.daily_change || 0 },
      { name: '\u79d1\u521b50', price: '--', chg: 0 },
      { name: '\u56fd\u503a\u6307\u6570', price: '--', chg: 0 }
    ];
    el.innerHTML = '<div class="muted">' + items[i].name + '</div><div class="fs16 fw7 mt4" style="font-feature-settings:\'tnum\'">' + items[i].price + '</div><div class="fs14 fw7 mt4 ' + cls(items[i].chg) + '">' + fmtPct(items[i].chg) + '</div>';
  });

  // Chips
  const chipRow = document.getElementById('fund-chips');
  chipRow.innerHTML = funds.map(f => {
    const bp = f.buy_point || {};
    const chg = f.daily_change || 0;
    const yld = bp.is_holding ? bp.yield_pct : null;
    return '<div class="card" style="flex:1;padding:14px 6px;text-align:center;cursor:pointer" onclick="switchTab(\'funds\')">' +
      '<div class="muted" style="margin-bottom:4px">' + f.code + '</div>' +
      '<div class="fs18 fw7 ' + cls(chg) + '" style="font-feature-settings:\'tnum\'">' + fmtPct(chg) + '</div>' +
      '<div style="font-size:12px;font-weight:600;margin-top:4px;color:' + (yld !== null ? (yld >= 0 ? 'var(--up)' : 'var(--down)') : 'var(--text3)') + '">' + (yld !== null ? fmtPct(yld) : '\u672a\u6301\u4ed3') + '</div>' +
      '<div class="muted" style="font-size:9px;margin-top:3px">' + (f.name || f.code).substring(0,10) + '</div></div>';
  }).join('');

  // Ranking
  const sorted = [...funds].sort((a, b) => (b.daily_change || 0) - (a.daily_change || 0));
  const medals = ['<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#e53935;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">1</span>',
    '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#f39c12;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">2</span>',
    '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#bbb;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center">3</span>'];
  document.getElementById('rank-list').innerHTML = sorted.map((f, i) =>
    '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;border-top:' + (i > 0 ? '.5px solid rgba(0,0,0,.03)' : 'none') + '">' +
    '<span style="width:18px;text-align:center;flex-shrink:0">' + (medals[i] || (i+1)) + '</span>' +
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + f.code + ' ' + (f.name||'').substring(0,8) + '</span>' +
    '<span class="' + cls(f.daily_change) + '" style="font-weight:600">' + fmtPct(f.daily_change) + '</span></div>'
  ).join('');

  // News
  const nl = document.getElementById('news-list');
  if (d.news && d.news.length > 0) {
    nl.innerHTML = d.news.slice(0, 3).map(n =>
      '<div style="padding:10px 0;border-top:.5px solid rgba(0,0,0,.03)">' +
      '<div style="font-size:13px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + (n.title || n.text || '') + '</div>' +
      '<div class="muted" style="margin-top:4px">' + (n.date || n.time || '\u521a\u521a') + '</div></div>'
    ).join('');
  }
}

// ===== Render Funds =====
function renderFunds(d) {
  const list = document.getElementById('fund-detail-list');
  if (!d.funds) return;
  list.innerHTML = d.funds.map(f => {
    const bp = f.buy_point || {};
    const chg = f.daily_change || 0;
    const riskCls = '<span style="padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500;background:rgba(229,57,53,.08);color:var(--up)">' + (f.ai_prediction?.risk_level || '\u4e2d') + '</span>';
    return '<div class="card" style="margin:8px 16px;padding:16px">' +
      '<div class="flex-between"><div><div class="muted" style="font-size:12px">' + f.code + '</div><div style="font-size:14px;font-weight:600;margin-top:2px">' + (f.name||'') + '</div></div>' + riskCls + '</div>' +
      '<div class="flex-between" style="margin:10px 0"><div style="font-size:24px;font-weight:700;font-feature-settings:\'tnum\'">' + (f.current_nav ? fmt(f.current_nav) : '--') + '</div><div style="font-size:16px;font-weight:600;color:' + (chg >= 0 ? 'var(--up)' : 'var(--down)') + '">' + fmtPct(chg) + '</div></div>' +
      '<div class="flex" style="margin:10px 0;padding:10px 0;border-top:.5px solid rgba(0,0,0,.03);border-bottom:.5px solid rgba(0,0,0,.03)">' +
      '<div style="flex:1;text-align:center"><div class="muted" style="font-size:10px">\u6301\u6709\u6536\u76ca</div><div style="font-size:13px;font-weight:600;margin-top:2px;color:' + (bp.is_holding ? (bp.yield_pct >= 0 ? 'var(--up)' : 'var(--down)') : 'var(--text3)') + '">' + (bp.is_holding ? fmtPct(bp.yield_pct||0) : '\u672a\u6301\u4ed3') + '</div></div>' +
      '<div style="flex:1;text-align:center;border-left:.5px solid rgba(0,0,0,.03)"><div class="muted" style="font-size:10px">7\u65e5</div><div style="font-size:13px;font-weight:600;margin-top:2px">' + (f.return_7d != null ? fmtPct(f.return_7d) : '--') + '</div></div>' +
      '<div style="flex:1;text-align:center;border-left:.5px solid rgba(0,0,0,.03)"><div class="muted" style="font-size:10px">1\u6708</div><div style="font-size:13px;font-weight:600;margin-top:2px">' + (f.return_1m != null ? fmtPct(f.return_1m) : '--') + '</div></div></div>' +
      (bp.is_holding ? '<div style="margin:8px 0;padding:8px;background:rgba(0,0,0,.03);border-radius:8px">' +
        '<div class="flex-between" style="font-size:12px"><span class="muted">\u6210\u672c\u4ef7</span><span style="font-weight:600">' + fmt(bp.cost_nav||0) + '</span>' +
        '<span class="muted">\u6301\u6709' + (bp.hold_days||0) + '\u5929</span><span style="font-weight:600;color:' + cls(bp.yield_pct||0) + '">' + fmtPct(bp.yield_pct||0) + '</span></div>' +
        (bp.target_nav ? '<div style="margin-top:6px"><div class="flex-between" style="font-size:11px"><span class="muted">\u76ee\u6807\u4ef7 ' + fmt(bp.target_nav) + '</span><span class="muted">\u8fdb\u5ea6 ' + (bp.progress_pct||0).toFixed(0) + '%</span></div>' +
        '<div style="margin-top:4px;height:3px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden"><div style="height:100%;border-radius:2px;background:linear-gradient(90deg,var(--down),var(--up));width:' + Math.min((bp.progress_pct||0),100) + '%"></div></div></div>' : '') +
      '</div>' : '') +
      '<button onclick="alert(\'\u4e70\u5165\u529f\u80fd\u5373\u5c06\u63a8\u51fa\')" style="width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#1a237e,#304ffe);color:#fff;cursor:pointer;transition:transform .2s">' + (bp.is_holding ? '\u786e\u8ba4\u4e70\u5165' : '\u7acb\u5373\u4e70\u5165') + '</button></div>';
  }).join('');
}

// ===== Render AI =====
function renderAI(d) {
  const funds = d.funds || [];
  if (!funds.length) return;
  const tabs = document.getElementById('ai-tabs');
  const content = document.getElementById('ai-content');
  tabs.innerHTML = funds.map((f, i) =>
    '<span style="flex:1;padding:6px 0;text-align:center;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;transition:all .2s' + (i===0 ? ';background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.06)' : ';color:var(--text3)') + '" onclick="switchAI(' + i + ')">' + f.code + '</span>'
  ).join('');
  let html = '';
  funds.forEach((f, i) => {
    const ai = f.ai_prediction || {};
    html += '<div id="ai-panel-' + i + '" style="display:' + (i===0?'block':'none') + '">' +
      '<div class="flex-between" style="margin-bottom:8px"><span class="muted">\u8d8b\u52bf</span><span style="font-size:16px;font-weight:600">' + (ai.trend || '--') + ' ' + (ai.trend_emoji || '') + '</span></div>' +
      '<div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px">' + (ai.advice || '\u6682\u65e0\u5206\u6790') + '</div>' +
      '<div class="flex gap8" style="flex-wrap:wrap">' +
      '<span style="padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(48,79,254,.08);color:var(--brand)">\u4f30\u503c: ' + (ai.valuation_position || '--') + '</span>' +
      '<span style="padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(255,152,0,.1);color:#ff9800">\u7f6e\u4fe1: ' + (ai.confidence || '--') + '</span>' +
      '<span style="padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(67,160,71,.08);color:var(--down)">\u98ce\u9669: ' + (ai.risk_level || '--') + '</span></div>' +
      '<div class="flex gap8" style="flex-wrap:wrap;margin-top:6px">' +
      '<span style="padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(48,79,254,.08);color:var(--brand)">\u652f\u6491 ' + (ai.key_levels ? ai.key_levels.split('/')[0] : '--') + '</span>' +
      '<span style="padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(48,79,254,.08);color:var(--brand)">\u538b\u529b ' + (ai.key_levels ? ai.key_levels.split('/')[1] : '--') + '</span></div></div>';
  });
  content.innerHTML = html;
  // Accuracy
  fetch(API_BASE + '/api/model-accuracy?days=7')
    .then(r => r.json()).then(d2 => {
      const vals = Object.values(d2 || {});
      if (vals.length > 0) {
        const v = vals[0] || {};
        document.getElementById('ai-accuracy').innerHTML =
          '<div><div class="fs18 fw7">' + (v.mae != null ? v.mae.toFixed(2) : '--') + '</div><div class="muted">MAE</div></div>' +
          '<div><div class="fs18 fw7">' + (v.win_rate != null ? (v.win_rate*100).toFixed(0)+'%' : '--') + '</div><div class="muted">\u65b9\u5411\u80dc\u7387</div></div>' +
          '<div><div class="fs18 fw7">' + (v.sample_count != null ? v.sample_count : '--') + '</div><div class="muted">\u6837\u672c\u6570</div></div>';
      }
    }).catch(() => {});

  // Buy signals
  const sig = document.getElementById('buy-signals');
  sig.innerHTML = funds.map(f => {
    const bp = f.buy_point || {};
    const ai = f.ai_prediction || {};
    const canBuy = bp.can_buy || false;
    const holding = bp.is_holding || false;
    const pct = bp.yield_pct || 0;
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:.5px solid rgba(0,0,0,.03);font-size:13px">' +
      '<span style="width:24px;text-align:center">' + (holding ? '\ud83d\udcc8' : (canBuy ? '\u26a0\ufe0f' : '\u274c')) + '</span>' +
      '<span style="flex:1">' + f.code + ' ' + (f.name||'').substring(0,8) + '</span>' +
      '<span style="font-weight:600;color:' + (holding ? (pct>=0?'var(--up)':'var(--down)') : (canBuy ? '#ff9800' : 'var(--text3)')) + '">' +
      (holding ? '\u6301\u6709 ' + fmtPct(pct) : (canBuy ? '\u8d2d\u4e70\u4fe1\u53f7' : bp.drop_pct ? '\u8ddd\u4e70\u70b9' + bp.drop_pct + '%' : '\u65e0\u4fe1\u53f7')) + '</span></div>';
  }).join('');

  // Profit benchmark
  const bench = document.getElementById('profit-benchmark');
  bench.innerHTML = funds.map(f => {
    const bp = f.buy_point || {};
    const r7 = f.return_7d, r1 = f.return_1m, r3 = f.return_3m, r6 = f.return_6m;
    return '<div style="padding:8px 0;border-top:.5px solid rgba(0,0,0,.03)">' +
      '<div style="font-size:12px;font-weight:600;margin-bottom:6px">' + f.code + ' ' + (f.name||'').substring(0,8) + '</div>' +
      '<div class="flex gap8" style="font-size:12px">' +
      '<span class="muted">7\u65e5: </span><span style="font-weight:600;color:' + cls(r7) + '">' + (r7!=null?fmtPct(r7):'--') + '</span>' +
      '<span class="muted">1\u6708: </span><span style="font-weight:600;color:' + cls(r1) + '">' + (r1!=null?fmtPct(r1):'--') + '</span>' +
      '<span class="muted">3\u6708: </span><span style="font-weight:600;color:' + cls(r3) + '">' + (r3!=null?fmtPct(r3):'--') + '</span>' +
      '<span class="muted">6\u6708: </span><span style="font-weight:600;color:' + cls(r6) + '">' + (r6!=null?fmtPct(r6):'--') + '</span></div></div>';
  }).join('');
}
function switchAI(idx) {
  document.querySelectorAll('#ai-tabs > span').forEach((t,i) => {
    t.style.background = ''; t.style.color = 'var(--text3)'; t.style.boxShadow = 'none';
    if (i === idx) { t.style.background = 'var(--card)'; t.style.color = 'var(--brand)'; t.style.boxShadow = '0 1px 4px rgba(0,0,0,.06)'; }
  });
  document.querySelectorAll('[id^="ai-panel-"]').forEach((p,i) => p.style.display = i===idx ? 'block' : 'none');
}

// ===== Profile =====
function renderProfile(d) {
  const funds = d.funds || [];
  const h = document.getElementById('profile-holdings');
  let ti = 0, tv = 0;
  h.innerHTML = funds.map(f => {
    const bp = f.buy_point || {};
    if (bp.is_holding) { ti += bp.cost_nav || 0; tv += f.current_nav || 0; }
    return '<div class="flex-between" style="padding:8px 0;font-size:13px;border-top:.5px solid rgba(0,0,0,.03)">' +
      '<span>' + (bp.is_holding ? '\ud83d\udcc8' : '\ud83d\udcc9') + ' ' + f.code + ' ' + (f.name||'').substring(0,6) + '</span>' +
      '<span style="font-weight:600;color:' + (bp.is_holding ? (bp.yield_pct>=0?'var(--up)':'var(--down)') : 'var(--text3)') + '">' + (bp.is_holding ? fmtPct(bp.yield_pct||0) : '\u672a\u6301\u4ed3') + '</span></div>';
  }).join('');
  const tp = tv - ti;
  document.getElementById('profile-invest').textContent = ti > 0 ? '\u00a5' + fmt(ti) : '\u00a50.00';
  document.getElementById('profile-value').textContent = tv > 0 ? '\u00a5' + fmt(tv) : '\u00a50.00';
  document.getElementById('profile-profit').textContent = tp >= 0 ? '+\u00a5' + fmt(tp) : '-\u00a5' + fmt(Math.abs(tp));
  document.getElementById('profile-profit').style.color = tp >= 0 ? 'var(--up)' : 'var(--down)';
}

// ===== Init =====
function switchTab(name) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  const el = document.querySelector('[data-tab="' + name + '"]');
  if (el) el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const ce = document.getElementById('tab-' + name);
  if (ce) ce.classList.add('active');
}

fetchData();
setInterval(fetchData, REFRESH_INTERVAL);

function updateClock() {
  document.getElementById('clock-display').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock, 10000);
</script>
</body>
</html>
