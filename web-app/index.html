    <script>
        // ============ 深色模式 ============
        // 立即应用主题，避免页面闪烁
        // 规则：开关即真理
        //   - 初始化：按时间设置一次（18:00-次日6:00 = 深色）
        //   - 开关点击：立即切换 UI（不写任何存储）
        //   - 60s 检查：不主动改，开关位置就是状态源
        //   - 刷新页面：重新按时间（不"永远"）
        (function() {
            try {
                const hour = new Date().getHours();
                if (hour >= 18 || hour < 6) {
                    document.body.classList.add('dark-mode');
                }
            } catch (e) {}
        })();

        function applyDarkModeUI() {
            const isDark = document.body.classList.contains('dark-mode');
            const icon = document.getElementById('appearanceIcon');
            const title = document.getElementById('appearanceTitle');
            const desc = document.getElementById('appearanceDesc');
            if (isDark) {
                if (icon) icon.textContent = '☀️';
                if (title) title.textContent = '浅色模式';
                if (desc) desc.textContent = '当前为深色，点击切换';
            } else {
                if (icon) icon.textContent = '🌙';
                if (title) title.textContent = '深色模式';
                if (desc) desc.textContent = '更舒适的夜间显示';
            }
        }

        function toggleDarkMode() {
            // 开关即真理：直接 toggle class，不写任何存储
            document.body.classList.toggle('dark-mode');
            applyDarkModeUI();
        }

        // DOM Ready 后刷新 UI 文本
        document.addEventListener('DOMContentLoaded', applyDarkModeUI);

        // ============ 访问密码保护（iOS 兼容版） ============
        // 使用 Cookie 存储（iOS Safari 和主屏幕模式下同一域名 Cookie 互通）
        // 同时保留 localStorage 作为备用
        const ACCESS_PASSWORD = "jjjr";
        const AUTH_COOKIE_NAME = "jjjr_auth";

        // --- Cookie 操作 ---
        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            const parts = [
                name + "=" + encodeURIComponent(value),
                "expires=" + expires.toUTCString(),
                "path=/"
            ];
            // 注意：SameSite=None 需要 Secure，HTTP natapp 环境用 Lax
            parts.push("SameSite=Lax");
            document.cookie = parts.join("; ");
        }
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }
        function deleteCookie(name) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        }

        function checkAuth() {
            // 优先检查 Cookie（iOS 主屏幕 + Safari 互通）
            const cookieVal = getCookie(AUTH_COOKIE_NAME);
            if (cookieVal) {
                try {
                    const data = JSON.parse(cookieVal);
                    const now = new Date().getTime();
                    return data.authed === true && data.expire > now;
                } catch (e) {}
            }
            // 兜底：检查 localStorage（本地 PC 浏览器兼容）
            const ls = localStorage.getItem(AUTH_COOKIE_NAME);
            if (ls) {
                try {
                    const data = JSON.parse(ls);
                    const now = new Date().getTime();
                    if (data.authed === true && data.expire > now) {
                        // 同步到 Cookie，方便下次直接走 Cookie
                        setCookie(AUTH_COOKIE_NAME, JSON.stringify(data), 7);
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }
        function setAuthed() {
            const expire = new Date().getTime() + 7 * 24 * 3600 * 1000;
            const payload = JSON.stringify({ authed: true, expire: expire });
            // 写入 Cookie（主存储，iOS 可共享）
            setCookie(AUTH_COOKIE_NAME, payload, 7);
            // 同时写入 localStorage（双保险）
            try { localStorage.setItem(AUTH_COOKIE_NAME, payload); } catch (e) {}
        }
        function showMain() {
            document.getElementById("authMask").style.display = "none";
            document.getElementById("mainContainer").style.display = "";
        }
        function hideMain() {
            document.getElementById("authMask").style.display = "";
            document.getElementById("mainContainer").style.display = "none";
        }
        function tryLogin() {
            const input = document.getElementById("authInput");
            const errorEl = document.getElementById("authError");
            const val = (input.value || "").trim();
            if (val === ACCESS_PASSWORD) {
                setAuthed();
                showMain();
                errorEl.textContent = "";
            } else {
                errorEl.textContent = "密码错误，请重试";
                input.value = "";
                input.focus();
            }
        }

        // 默认先隐藏主内容，显示密码层
        hideMain();

        if (checkAuth()) {
            showMain();
        } else {
            // DOM 已经加载完毕，直接绑定
            const input = document.getElementById("authInput");
            const button = document.getElementById("authButton");
            if (button) button.addEventListener("click", tryLogin);
            if (input) {
                input.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") tryLogin();
                });
                // 自动聚焦（iOS 需要用户点击，延迟聚焦避免键盘弹不起来）
                setTimeout(function () {
                    try { input.focus(); } catch (e) {}
                }, 100);
            }
        }

        // 基金数据 - 从API获取
        let fundData = [];
        let newsData = [];
        let historicalYieldsData = {};
        let indexData = {
            code: '000001',
            name: '上证指数',
            current: 0,
            previous: 0,
            dailyChange: 0,
            history: []
        };
        let bondIndexData = {
            code: '000012',
            name: '国债指数',
            current: 0,
            previous: 0,
            dailyChange: 0,
            history: []
        };
        let hs300IndexData = null;

        // 记录每张卡片的历史展开状态
        let historyOpenMap = {};

        // API 基础地址：如果是 file:// 协议（直接双击打开 HTML）
        // 则 fallback 到 http://localhost:8000/api
        const _isFileProtocol = window.location.protocol === 'file:';
        const API_BASE = _isFileProtocol
            ? 'http://localhost:8000/api'
            : (window.location.protocol + '//' + window.location.host + '/api');

        // 从API获取实时数据
        // 诊断日志（用于排查主屏幕环境问题）
        const diagLog = typeof window.__DIAG !== 'undefined' ? window.__DIAG : { messages: [], add(m) { this.messages.push(`[${new Date().toISOString().slice(11,19)}] ${m}`); } };
        diagLog.add(`页面启动 · 协议: ${location.protocol} · 主机: ${location.host} · API_BASE: ${API_BASE}`);

        async function fetchRealTimeData(force = false) {
            try {
                diagLog.add('开始请求 /api/portfolio' + (force ? ' (强制刷新)' : ''));
                // 添加超时控制（iOS 主屏幕环境请求可能在 5-10 秒后超时）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => { controller.abort(); diagLog.add('请求超时(30s)！'); }, 30000);
                // 加时间戳防缓存（iOS 主屏幕环境可能强缓存 GET 请求）
                const ts = Date.now();
                const forceParam = force ? '&force=1' : '';
                const response = await fetch(API_BASE + '/portfolio?_t=' + ts + forceParam, { signal: controller.signal, cache: 'no-store' });
                clearTimeout(timeoutId);
                diagLog.add('响应状态: ' + response.status);
                if (!response.ok) {
                    throw new Error(`API请求失败 (HTTP ${response.status})`);
                }
                const data = await response.json();
                diagLog.add('JSON解析成功, funds: ' + (data.funds ? data.funds.length : '无'));
                indexData = {
                    code: data.index.code,
                    name: data.index.name,
                    current: data.index.current,
                    previous: data.index.previous,
                    dailyChange: data.index.daily_change,
                    history: data.index.history || []
                };

                // 国债指数
                if (data.bond_index) {
                    bondIndexData = {
                        code: data.bond_index.code,
                        name: data.bond_index.name,
                        current: data.bond_index.current,
                        previous: data.bond_index.previous,
                        dailyChange: data.bond_index.daily_change,
                        history: data.bond_index.history || []
                    };
                }

                // 沪深300指数
                hs300IndexData = null;
                if (data.hs300_index) {
                    hs300IndexData = {
                        code: data.hs300_index.code,
                        name: data.hs300_index.name,
                        current: data.hs300_index.current,
                        previous: data.hs300_index.previous,
                        dailyChange: data.hs300_index.daily_change,
                        history: data.hs300_index.history || []
                    };
                }

                fundData = data.funds.map(fund => ({
                    code: fund.code,
                    name: fund.name,
                    type: fund.type,
                    currentNav: fund.current_nav,
                    previousNav: fund.previous_nav,
                    navDate: fund.nav_date,
                    estimated: fund.estimated,
                    dailyChange: fund.daily_change,
                    estimatedNav: fund.estimated_nav || 0,
                    estimatedChange: fund.estimated_change || 0,
                    estimatedTime: fund.estimated_time || '',
                    history: fund.history || [],
                    buyPoint: fund.buy_point || null,
                    aiPrediction: fund.ai_prediction || null,
                    buy_point_ref_date: fund.buy_point_ref_date || '',
                    holdings: fund.holdings || [],
                    // === 基金专属模型（指数跟随 / 多因子 / 债基基线）===
                    model_type: fund.model_type || 'residual_only',
                    model_estimated_change: typeof fund.model_estimated_change === 'number' ? fund.model_estimated_change : 0,
                    model_benchmark_change: typeof fund.model_benchmark_change === 'number' ? fund.model_benchmark_change : 0,
                    model_benchmark_name: fund.model_benchmark_name || '',
                    model_offset: typeof fund.model_offset === 'number' ? fund.model_offset : 0,
                    model_std: typeof fund.model_std === 'number' ? fund.model_std : 0,
                    model_confidence: fund.model_confidence || 'none',
                    model_sample_count: fund.model_sample_count || 0,
                    model_enabled: fund.model_enabled || false,
                    // === gsz 残差修正 ===
                    corrected_estimated_change: typeof fund.corrected_estimated_change === 'number' ? fund.corrected_estimated_change : 0,
                    correction_offset: typeof fund.correction_offset === 'number' ? fund.correction_offset : 0,
                    correction_std: typeof fund.correction_std === 'number' ? fund.correction_std : 0,
                    correction_confidence: fund.correction_confidence || 'none',
                    correction_sample_count: fund.correction_sample_count || 0,
                    // === 区间收益（近7日/1月/3月/6月，从天天基金手机 API 抓取） ===
                    return_7d: typeof fund.return_7d === 'number' ? fund.return_7d : 0,
                    return_1m: typeof fund.return_1m === 'number' ? fund.return_1m : 0,
                    return_3m: typeof fund.return_3m === 'number' ? fund.return_3m : 0,
                    return_6m: typeof fund.return_6m === 'number' ? fund.return_6m : 0,
                    // 上一交易日预估涨跌（%），未开盘时显示用
                    prevEstChange: typeof fund.prev_est_change === 'number' ? fund.prev_est_change : 0
                }));

                newsData = data.news || [];
                
                // 历史收益基准数据
                historicalYieldsData = data.historical_yields || {};

                diagLog.add('数据赋值完成, fundData: ' + fundData.length + '条, indexData.current: ' + indexData.current);
                return {
                    updateTime: data.time,
                    updateDate: data.date
                };
            } catch (error) {
                console.error('获取数据失败:', error);
                diagLog.add(`❌ 请求失败: ${error.message || error}`);
                throw error;
            }
        }

        // 更新初始买入净值
        async function submitCostNav(fundCode) {
            const input = document.getElementById(`cost-input-${fundCode}`);
            if (!input) return;
            const val = parseFloat(input.value);
            if (isNaN(val) || val <= 0) {
                alert('请输入有效的净值数字（大于0）');
                return;
            }
            // 找到该基金的当前净值，防止误填为当前净值导致0收益
            const fund = fundData.find(f => f.code === fundCode);
            const currentNav = fund ? fund.currentNav : 0;
            if (currentNav > 0 && Math.abs(val - currentNav) < 0.0001) {
                alert('成本价不能等于当前净值！\n请输入您的实际买入成本净值。');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/cost-nav`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: fundCode, cost_nav: val, drop_threshold: 3.0 })
                });
                if (!response.ok) {
                    throw new Error('更新失败');
                }
                await response.json();
                refreshData();

        // 渲染资讯情绪概览条
        function renderNewsMoodBar() {
            const bar = document.getElementById('newsMoodBar');
            if (!bar) return;
            if (!newsData || newsData.length === 0) {
                bar.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:6px 0;">暂无市场情绪数据</div>';
                return;
            }
            const counts = { bullish: 0, bearish: 0, neutral: 0 };
            for (const n of newsData) {
                const s = n.sentiment || 'neutral';
                if (counts[s] !== undefined) counts[s]++;
            }
            const total = newsData.length;
            const score = total > 0 ? Math.round((counts.bullish - counts.bearish) / total * 100) : 0;
            let label, labelColor, emoji;
            if (score >= 50)      { label = '强势多头'; labelColor = '#2e7d32'; emoji = '🔥'; }
            else if (score >= 20) { label = '偏多';     labelColor = '#43a047'; emoji = '📈'; }
            else if (score > -20) { label = '震荡中性'; labelColor = '#757575'; emoji = '⚖️'; }
            else if (score > -50) { label = '偏空';     labelColor = '#e53935'; emoji = '📉'; }
            else                  { label = '弱势空头'; labelColor = '#b71c1c'; emoji = '❄️'; }

            // score 范围 -100~+100，映射到 0~100% (marker left)
            const markerLeft = ((score + 100) / 200) * 100;
            bar.innerHTML = `
                <div class="news-mood-header">
                    <span class="news-mood-label" style="color:${labelColor};">${emoji} 今日市场情绪：${label}</span>
                    <span class="news-mood-counts">
                        <span class="news-mood-count" style="color:#c62828;">▲ ${counts.bullish} 利好</span>
                        <span class="news-mood-count" style="color:#2e7d32;">▼ ${counts.bearish} 利空</span>
                        <span class="news-mood-count" style="color:#9e9e9e;">— ${counts.neutral}</span>

                    <div class="news-mood-marker" style="left:${markerLeft}%;"></div>
                </div>
                <div class="news-mood-scale">
                    <span>空 · ${score}</span>
                    <span>中性</span>
                    <span>多 · +100</span>
                </div>

        }

        // 新闻正文预览弹层
        let _newsModalEscBound = false;
        function openNewsModal(evt, url, title) {
            if (evt) { evt.preventDefault(); evt.stopPropagation(); }
            // 移除旧弹层
            const old = document.getElementById('newsModalRoot');
            if (old) old.remove();

            const root = document.createElement('div');
            root.id = 'newsModalRoot';
            root.className = 'news-modal-backdrop';
            root.innerHTML = `
                <div class="news-modal" onclick="event.stopPropagation();">
                    <div class="news-modal-header">
                        <div class="news-modal-title">${title || '新闻预览'}</div>
                        <button class="news-modal-close" onclick="closeNewsModal()" aria-label="关闭">×</button>
                    </div>
                    <div class="news-modal-meta" id="newsModalMeta">
                        <span>提取正文中...</span>
                    </div>
                    <div class="news-modal-body" id="newsModalBody">
                        <div class="news-modal-loading">正在解析正文</div>
                    </div>
                    <div class="news-modal-footer">
                        <button class="btn-secondary" onclick="closeNewsModal()">关闭</button>
                        <a class="btn-primary" href="${url}" target="_blank" rel="noopener noreferrer">查看原文</a>
                    </div>
                </div>
            `;
            // 点击背景关闭
            root.addEventListener('click', function(e) {
                if (e.target === root) closeNewsModal();
            });
            document.body.appendChild(root);
            document.body.style.overflow = 'hidden';

            // ESC 关闭（只绑一次）
            if (!_newsModalEscBound) {
                _newsModalEscBound = true;
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeNewsModal();
                });
            }

            // 抓取正文
            const apiUrl = '/api/news-content?url=' + encodeURIComponent(url);
            fetch(apiUrl, { timeout: 20000 })
                .then(r => r.json())
                .then(data => {
                    const metaEl = document.getElementById('newsModalMeta');
                    const bodyEl = document.getElementById('newsModalBody');
                    if (!metaEl || !bodyEl) return; // 弹层已被关闭
                    if (data.ok) {
                        const tagsLine = (data.date ? `📅 ${data.date} · ` : '') + `${data.length} 字`;
                        metaEl.innerHTML = `<span>${tagsLine}</span><span>仅含正文，不含图片</span>`;
                        bodyEl.textContent = data.content || '（未能提取到正文）';
                    } else {
                        metaEl.innerHTML = '<span style="color:#e53935;">提取失败</span>';
                        bodyEl.innerHTML = `<div class="news-modal-error">${data.error || '无法获取正文，请查看原文'}</div>`;
                    }
                })
                .catch(err => {
                    const bodyEl = document.getElementById('newsModalBody');
                    if (bodyEl) bodyEl.innerHTML = `<div class="news-modal-error">网络异常：${err.message}</div>`;
                });
        }

        function closeNewsModal() {
            const root = document.getElementById('newsModalRoot');
            if (root) root.remove();
            document.body.style.overflow = '';
        }

                                <div class="yield-summary-value" style="color:var(--text-secondary);">¥${buyPoint.cost_nav.toFixed(4)}</div>

                            <div class="yield-summary-item">
                                <div class="yield-summary-label">最新净值</div>
                                <div class="yield-summary-value" style="color:var(--text-primary);font-size:16px;">¥${fund.currentNav.toFixed(4)}</div>

                            <div class="yield-summary-item">
                                <div class="yield-summary-label">${isHolding ? '持有收益' : '买点收益'}</div>

        // 展开/收起历史明细
        function toggleHistory(fundCode) {
            historyOpenMap[fundCode] = !historyOpenMap[fundCode];
            const table = document.getElementById(`history-${fundCode}`);
            const toggle = document.querySelector(`#fund-card-${fundCode} .history-toggle`);
            if (table && toggle) {
                if (historyOpenMap[fundCode]) {
                    table.classList.add('open');
                    toggle.classList.add('open');
                } else {
                    table.classList.remove('open');
                    toggle.classList.remove('open');
                }
            }
        }

        // ====== 弹框工具函数 ======
        let _pendingAction = null; // 存储待执行的动作

        function showPriceModal(title, fundName, defaultPrice, hint, actionLabel, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalFundName').textContent = fundName;
            document.getElementById('modalHint').textContent = hint;
            document.getElementById('modalConfirmBtn').textContent = actionLabel;
            const input = document.getElementById('modalPriceInput');
            input.value = Number(defaultPrice).toFixed(4);
            setTimeout(() => input.focus(), 100);

            _pendingAction = onConfirm;
            document.getElementById('priceModal').classList.add('show');
        }

        function hidePriceModal() {
            document.getElementById('priceModal').classList.remove('show');
            _pendingAction = null;
        }

        function showResultModal(title, bodyHtml) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultBody').innerHTML = bodyHtml;
            document.getElementById('resultModal').classList.add('show');
        }

        function hideResultModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        // 弹框按钮绑定（页面加载后绑定一次）
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('modalCancelBtn').addEventListener('click', hidePriceModal);
            document.getElementById('modalConfirmBtn').addEventListener('click', function() {
                const val = document.getElementById('modalPriceInput').value;
                const price = parseFloat(val);
                if (isNaN(price) || price <= 0) {
                    alert('请输入有效的价格');
                    return;
                }
                if (_pendingAction) {
                    _pendingAction(price);
                }
                hidePriceModal();
            });
            document.getElementById('resultOkBtn').addEventListener('click', function() {
                hideResultModal();
                refreshData();
            });
            // 点击遮罩关闭
            document.getElementById('priceModal').addEventListener('click', function(e) {
                if (e.target === this) hidePriceModal();
            });
            document.getElementById('resultModal').addEventListener('click', function(e) {
                if (e.target === this) hideResultModal();
            });
        });

        // 确认买入：弹框输入价格，然后调用后端
        function confirmBuy(fundCode, fundName, currentNav) {
            const todayStr = new Date().toLocaleDateString('zh-CN');
            showPriceModal(
                '💰 确认买入',
                `${fundName} (${fundCode})`,
                currentNav,
                `买入日期：${todayStr} · 价格可直接编辑修改 · 补仓将直接更新成本价`,
                '确认买入',
                function(price) {
                    // 买入接口：使用全局 API_BASE（兼容 file:// 场景）
                    fetch(`${API_BASE}/buy/${fundCode}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ buy_price: price })
                    })
                        .then(res => {
                            if (!res.ok) throw new Error('后端响应异常');
                            return res.json();
                        })
                        .then(data => {
                            const bp = data.buy_price || price;
                            const bd = data.buy_date || todayStr;
                            const isAdditional = data.is_additional_buy ? '（补仓）' : '';
                            showResultModal('✅ 买入成功' + isAdditional,
                                `<div style="font-size:13px;line-height:1.8;">` +
                                `<div>成本价：<b style="color:#1976d2;font-size:15px;">¥${Number(bp).toFixed(4)}</b></div>` +
                                `<div>买入日期：<b>${bd}</b></div>` +
                                `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-color);color:var(--text-muted);font-size:11px;">` +
                                `点击"好的"刷新页面查看新的持仓状态</div></div>`
                            );
                        })
                        .catch(err => {
                            showResultModal('❌ 买入失败',
                                `<div style="font-size:13px;color:#c62828;">${err.message}</div>` +
                                `<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">请检查后端服务是否启动</div>`
                            );
                        });
                }
            );
        }

        // 确认卖出：弹框输入卖出价（可修改），然后调用后端
        function confirmSell(fundCode, fundName, buyPrice, currentYield) {
            const todayStr = new Date().toLocaleDateString('zh-CN');
            const currentNav = buyPrice * (1 + currentYield / 100);
            const yieldSign = currentYield >= 0 ? '+' : '';
            showPriceModal(
                '🔻 确认卖出',
                `${fundName} (${fundCode})`,
                currentNav,
                `成本价：¥${Number(buyPrice).toFixed(4)} · 当前收益：${yieldSign}${Number(currentYield).toFixed(2)}% · 价格可直接编辑修改`,
                '确认卖出',
                function(sellPrice) {
                    const finalYield = ((sellPrice - buyPrice) / buyPrice) * 100;
                    // 卖出接口：使用全局 API_BASE（兼容 file:// 场景）
                    fetch(`${API_BASE}/sell/${fundCode}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sell_price: sellPrice, buy_price: buyPrice })
                    })
                        .then(res => {
                            if (!res.ok) throw new Error('后端响应异常');
                            return res.json();
                        })
                        .then(data => {
                            const fs = finalYield >= 0 ? '+' : '';
                            const yieldColor = finalYield >= 0 ? '#c62828' : '#2e7d32';
                            showResultModal('✅ 卖出成功',
                                `<div style="font-size:13px;line-height:1.8;">` +
                                `<div>买入成本：<b>¥${Number(buyPrice).toFixed(4)}</b></div>` +
                                `<div>卖出价格：<b style="color:#1976d2;font-size:15px;">¥${Number(sellPrice).toFixed(4)}</b></div>` +
                                `<div>最终收益：<b style="color:${yieldColor};font-size:15px;">${fs}${Number(finalYield).toFixed(2)}%</b></div>` +
                                `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-color);color:var(--text-muted);font-size:11px;">` +
                                `持仓记录已清空，系统将重新进行买点判断</div></div>`
                            );
                        })
                        .catch(err => {
                            showResultModal('❌ 卖出失败',
                                `<div style="font-size:13px;color:#c62828;">${err.message}</div>` +
                                `<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">请检查后端服务是否启动</div>`
                            );
                        });
                }
            );
        }

        // 格式化时间
        function formatTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // 刷新数据（force=true 强制刷新，绕过 30s 整页缓存）
        async function refreshData(force = false) {
            const indexCard = document.getElementById('indexCard');
            const fundList = document.getElementById('fundList');
            const refreshHint = document.getElementById('refreshHint');

            indexCard.classList.add('refreshing');
            const cards = fundList.querySelectorAll('.fund-card');
            cards.forEach(card => card.classList.add('refreshing'));
            refreshHint.textContent = '刷新中...';

            try {
                const data = await fetchRealTimeData(force);
                diagLog.add('进入渲染流程...');

                try { renderIndex(); diagLog.add('✓ renderIndex OK'); } catch(e) { diagLog.add('❌ renderIndex: ' + e.message); }
                try { renderAiSummary(); diagLog.add('✓ renderAiSummary OK'); } catch(e) { diagLog.add('❌ renderAiSummary: ' + e.message); }
                try { renderModelAccuracy(); diagLog.add('✓ renderModelAccuracy OK'); } catch(e) { diagLog.add('❌ renderModelAccuracy: ' + e.message); }
                try { renderFundSummary(); diagLog.add('✓ renderFundSummary OK'); } catch(e) { diagLog.add('❌ renderFundSummary: ' + e.message); }
                try { renderHistoricalYields(); diagLog.add('✓ renderHistoricalYields OK'); } catch(e) { diagLog.add('❌ renderHistoricalYields: ' + e.message); }
                try { renderFundList(); diagLog.add('✓ renderFundList OK'); } catch(e) { diagLog.add('❌ renderFundList: ' + e.message); }
                try { renderNewsList(); diagLog.add('✓ renderNewsList OK'); } catch(e) { diagLog.add('❌ renderNewsList: ' + e.message); }
                diagLog.add('渲染全部完成');

                document.getElementById('indexUpdateTime').textContent =
                    `更新时间 ${data.updateDate} ${data.updateTime}`;

            } catch (error) {
                console.error('刷新失败:', error);
                refreshHint.textContent = '重新连接...';
                // 显示诊断信息到页面
                const fundListEl = document.getElementById('fundList');
                if (fundListEl && fundListEl.innerHTML.includes('暂无数据')) {
                    fundListEl.innerHTML = `<div style="padding:20px;text-align:center;">
                        <div style="font-size:14px;color:#c62828;margin-bottom:8px;">⚠️ 数据加载失败</div>
                        <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
                            <div>请检查网络连接</div>
                            <div style="font-size:10px;color:var(--text-muted);margin-top:6px;">${diagLog.messages.slice(-2).join('<br>')}</div>
                            <button onclick="refreshData()" style="margin-top:10px;padding:8px 20px;background:#1976d2;border:none;color:white;border-radius:6px;font-size:13px;cursor:pointer;">
                                点击重试
                            </button>
                        </div>
                    </div>`;
                }
                // 尝试最多3次重试
                let retries = 0;
                const maxRetries = 3;
                const doRetry = async () => {
                    if (retries >= maxRetries) {
                        refreshHint.textContent = '点击刷新';
                        return;
                    }
                    retries++;
                    refreshHint.textContent = '重试中 (' + retries + '/' + maxRetries + ')...';
                    try {
                        const data = await fetchRealTimeData(force);
                        if (data) {
                            try { renderIndex(); } catch(e) { diagLog.add('❌ retry renderIndex: ' + e.message); }
                            try { renderAiSummary(); } catch(e) { diagLog.add('❌ retry renderAiSummary: ' + e.message); }
                            try { renderModelAccuracy(); } catch(e) { diagLog.add('❌ retry renderModelAccuracy: ' + e.message); }
                            try { renderFundSummary(); } catch(e) { diagLog.add('❌ retry renderFundSummary: ' + e.message); }
                            try { renderHistoricalYields(); } catch(e) { diagLog.add('❌ retry renderHist: ' + e.message); }
                            try { renderFundList(); } catch(e) { diagLog.add('❌ retry renderFundList: ' + e.message); }
                            try { renderNewsList(); } catch(e) { diagLog.add('❌ retry renderNews: ' + e.message); }
                            document.getElementById('indexUpdateTime').textContent =
                                '更新时间 ' + data.updateDate + ' ' + data.updateTime;
                            refreshHint.textContent = '点击刷新';
                        }
                    } catch (e) {
                        setTimeout(doRetry, 3000);
                    }
                };
                setTimeout(doRetry, 3000);
            } finally {
                indexCard.classList.remove('refreshing');
                const remainingCards = fundList.querySelectorAll('.fund-card');
                remainingCards.forEach(card => card.classList.remove('refreshing'));
                setTimeout(() => {
                    refreshHint.textContent = '点击刷新';
                }, 1000);
            }
        }

        // 渲染上证指数
        function renderIndex() {
            const changeClass = indexData.dailyChange >= 0 ? 'up' : 'down';
