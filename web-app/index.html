        // 生成专业详细分析（折叠面板）
        function generateProfessionalAnalysisHtml(fund, buyPoint, isHolding) {
            const history = fund.history || [];
            if (history.length === 0) {
                return `<div class="fund-analysis-toggle" onclick="toggleAnalysis('${fund.code}')">
                    <div class="fund-analysis-toggle-header">
                        <span>📊 专业详细分析</span>
                        <span class="arrow">▾</span>
                    </div>
                    <div class="fund-analysis-body">
                        <div class="analysis-section-text" style="color:var(--text-muted);">暂无历史数据进行分析</div>
                    </div>
                </div>`;
            }

            // ===== 1. 关键指标计算（仅取最近7个交易日）=====
            const navs7 = history.slice(0, 8).map(h => h.nav);  // 最近8条（含今天），即7个交易日跨度
            const changes7 = history.slice(0, 8).map(h => h.change);
            const latestNav = navs7[0];           // 最新净值
            const oldestNav7 = navs7[navs7.length - 1]; // 7个交易日前净值
            const periodReturn = ((latestNav - oldestNav7) / oldestNav7) * 100;

            // 7日波动率（标准差）
            const avgChange = changes7.reduce((a, b) => a + b, 0) / changes7.length;
            const variance = changes7.reduce((sum, c) => sum + Math.pow(c - avgChange, 2), 0) / changes7.length;
            const volatility = Math.sqrt(variance);

            // 7日最大回撤（从最高点到后续最低点的最大跌幅）
            let peak = navs7[0];
            let maxDrawdown = 0;
            for (const nav of navs7) {
                if (nav > peak) peak = nav;
                const dd = (nav - peak) / peak * 100;
                if (dd < maxDrawdown) maxDrawdown = dd;
            }

            // 连涨 / 连跌天数（从最新交易日往回数，最近7日）
            let consecutiveUp = 0;
            let consecutiveDown = 0;
            for (let i = 0; i < changes7.length; i++) {
                if (changes7[i] > 0) consecutiveUp++;
                else break;
            }
            for (let i = 0; i < changes7.length; i++) {
                if (changes7[i] < 0) consecutiveDown++;
                else break;
            }

            // 相对7日高点/低点位置
            const maxNav = Math.max(...navs7);
            const minNav = Math.min(...navs7);
            const posInRange = maxNav !== minNav ? ((latestNav - minNav) / (maxNav - minNav) * 100) : 50;

            // ===== 2. 市场环境分析 =====
            const fundType = (fund.type || '').toLowerCase();
            const isBond = ['债券', '债', '稳健', '纯债', '二级债'].some(k => fundType.includes(k));
            const isIndex = ['指数', 'etf', '联接', '增强', '上证'].some(k => fundType.includes(k));

            let marketEnv = "";
            if (isBond) {
                const bIdx = bondIndexData;
                if (bIdx && bIdx.current > 0 && bIdx.dailyChange !== 0) {
                    if (bIdx.dailyChange > 0.1) {
                        marketEnv = `债券市场最新交易日表现偏暖（+${bIdx.dailyChange.toFixed(2)}%），利率预期稳中向好，适合稳健配置。`;
                    } else if (bIdx.dailyChange < -0.1) {
                        marketEnv = `债券市场最新交易日小幅调整（${bIdx.dailyChange.toFixed(2)}%），短期资金面波动，不改长期配置价值。`;
                    } else {
                        marketEnv = `债券市场最新交易日整体平稳（${bIdx.dailyChange.toFixed(2)}%），票息收益为主线，适合持有到期策略。`;
                    }
                } else {
                    marketEnv = `债券型基金以票息收入为主，需关注央行货币政策及利率走势变化。`;
                }
            } else {
                const sIdx = indexData;
                if (sIdx && sIdx.current > 0) {
                    if (sIdx.dailyChange > 1.0) {
                        marketEnv = `上证指数最新交易日大幅上涨（+${sIdx.dailyChange.toFixed(2)}%），市场情绪偏积极，风险偏好提升。`;
                    } else if (sIdx.dailyChange > 0.3) {
                        marketEnv = `上证指数最新交易日温和上涨（+${sIdx.dailyChange.toFixed(2)}%），市场情绪平稳偏暖。`;
                    } else if (sIdx.dailyChange < -1.0) {
                        marketEnv = `上证指数最新交易日明显下跌（${sIdx.dailyChange.toFixed(2)}%），风险偏好下降，需注意持仓波动。`;
                    } else if (sIdx.dailyChange < -0.3) {
                        marketEnv = `上证指数最新交易日小幅调整（${sIdx.dailyChange.toFixed(2)}%），市场情绪偏谨慎。`;
                    } else {
                        marketEnv = `上证指数最新交易日震荡整理（${sIdx.dailyChange.toFixed(2)}%），方向不明朗，宜观望等待趋势信号。`;
                    }
                }
            }

            // ===== 3. 技术面分析 =====
            let techAnalysis = "";
            const dChange = fund.dailyChange || 0;
            if (isIndex) {
                if (consecutiveUp >= 2) {
                    techAnalysis = `已连续${consecutiveUp}日上涨，短期动能较强。近7日累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%，位于7日净值区间的${posInRange.toFixed(0)}%位置。`;
                } else if (consecutiveDown >= 2) {
                    techAnalysis = `已连续${consecutiveDown}日调整，短期趋势偏弱。近7日累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%，位于7日净值区间的${posInRange.toFixed(0)}%位置。`;
                } else if (dChange > 0.5) {
                    techAnalysis = `最新交易日上涨${dChange.toFixed(2)}%，短期表现活跃，需关注成交量与持续性。`;
                } else if (dChange < -0.5) {
                    techAnalysis = `最新交易日调整${dChange.toFixed(2)}%，需关注下方支撑是否有效。`;
                } else {
                    techAnalysis = `最新交易日震荡运行（${dChange >= 0 ? '+' : ''}${dChange.toFixed(2)}%），波动有限，方向待明。`;
                }
            } else if (isBond) {
                techAnalysis = `近7日净值累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(3)}%，波动率${volatility.toFixed(2)}%，整体平稳运行。债券型基金应关注久期与信用风险。`;
            } else {
                if (consecutiveUp >= 2) {
                    techAnalysis = `近期连续${consecutiveUp}日上涨，短期动能尚可。近7日累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%，位于区间${posInRange.toFixed(0)}%位置。`;
                } else if (consecutiveDown >= 2) {
                    techAnalysis = `近期连续${consecutiveDown}日调整，短期趋势偏弱。近7日累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%，位于区间${posInRange.toFixed(0)}%位置。`;
                } else {
                    techAnalysis = `近7日表现中性，累计${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%，日波动率${volatility.toFixed(2)}%，整体处于震荡区间。`;
                }
            }

            // ===== 4. 操作建议（分持仓 / 未持仓）=====
            let positionAdvice = "";
            if (isHolding) {
                const currentYield = buyPoint.yield_pct;
                if (currentYield > 10) {
                    positionAdvice = `当前持有收益率+${currentYield.toFixed(2)}%，已达止盈目标，建议逐步减仓锁定收益，保留30-50%仓位以享受可能的进一步上涨。`;
                } else if (currentYield > 3) {
                    positionAdvice = `当前持有收益率+${currentYield.toFixed(2)}%，处于盈利区间。建议继续持有观察，跌破成本线后再考虑止损。`;
                } else if (currentYield < -5) {
                    positionAdvice = `当前持亏${currentYield.toFixed(2)}%，若基本面未变，可考虑分批定投摊低成本，不宜一次性加仓。`;
                } else {
                    positionAdvice = `当前${currentYield >= 0 ? '微盈' : '微亏'}${Math.abs(currentYield).toFixed(2)}%，属于正常波动，耐心持有等待趋势明朗。`;
                }
            } else {
                const canBuy = buyPoint.can_buy;
                const yieldPctFromCost = buyPoint.yield_pct;
                if (canBuy) {
                    positionAdvice = `当前点位已达买点区间（相对成本基准${yieldPctFromCost >= 0 ? '+' : ''}${yieldPctFromCost.toFixed(2)}%），风险收益比良好。建议采用分批建仓方式，例如1/3资金先行，其余在趋势明朗后再配置。`;
                } else if (yieldPctFromCost < 0) {
                    positionAdvice = `当前点位距历史基准已有${yieldPctFromCost.toFixed(2)}%空间，但尚未达买入阈值。建议继续观望，等待更好的入场机会。`;
                } else if (periodReturn > 5) {
                    positionAdvice = `近7日累计上涨${periodReturn.toFixed(2)}%，短期涨幅较大，不建议追涨，可等回调后再考虑。`;
                } else if (periodReturn < -5) {
                    positionAdvice = `近7日累计下跌${Math.abs(periodReturn).toFixed(2)}%，短期已处低位，如基本面未变，可关注分批建仓机会。`;
                } else {
                    positionAdvice = `当前估值水平中性，尚未形成明确买点。建议定投为主，避免情绪化操作。`;
                }
            }

            // ===== 5. 风险提示 =====
            let riskTags = [];
            if (volatility > 1.5) {
                riskTags.push({ text: `高波动率 ${volatility.toFixed(1)}%`, level: 'high' });
            } else if (volatility > 0.8) {
                riskTags.push({ text: `中等波动 ${volatility.toFixed(1)}%`, level: '' });
            } else {
                riskTags.push({ text: `低波动 ${volatility.toFixed(1)}%`, level: 'low' });
            }

            if (maxDrawdown < -3) {
                riskTags.push({ text: `最大回撤 ${maxDrawdown.toFixed(1)}%`, level: 'high' });
            } else if (maxDrawdown < -1.5) {
                riskTags.push({ text: `最大回撤 ${maxDrawdown.toFixed(1)}%`, level: '' });
            } else {
                riskTags.push({ text: `回撤可控 ${maxDrawdown.toFixed(1)}%`, level: 'low' });
            }

            if (isHolding && buyPoint.yield_pct < 0) {
                riskTags.push({ text: `浮亏 ${buyPoint.yield_pct.toFixed(1)}%`, level: '' });
            }

            let riskTips = "";
            if (isIndex) {
                riskTips += "指数型基金跟踪大盘走势，无法规避系统性风险。建议关注宏观经济与政策面变化。";
            } else if (isBond) {
                riskTips += "债券型基金主要受利率与信用风险影响。加息周期对长久期债基有压制作用。";
            } else {
                riskTips += "股票/混合型基金受市场整体影响较大。建议结合估值、基本面、行业轮动综合判断。";
            }
            riskTips += " 非交易日请以基金公司官方净值为准，以上仅作数据与趋势参考，不构成投资建议。";

            // ===== 6. 关键指标渲染 =====
            const metricHtml = `
                <div class="analysis-metrics-grid">
                    <div class="analysis-metric-item">
                        <div class="analysis-metric-label">7日累计</div>
                        <div class="analysis-metric-value ${periodReturn >= 0 ? 'up' : 'down'}">${periodReturn >= 0 ? '+' : ''}${periodReturn.toFixed(2)}%</div>
                    </div>
                    <div class="analysis-metric-item">
                        <div class="analysis-metric-label">日波动率</div>
                        <div class="analysis-metric-value">${volatility.toFixed(2)}%</div>
                    </div>
                    <div class="analysis-metric-item">
                        <div class="analysis-metric-label">7日最大回撤</div>
                        <div class="analysis-metric-value down">${maxDrawdown.toFixed(2)}%</div>
                    </div>
                    <div class="analysis-metric-item">
                        <div class="analysis-metric-label">净值区间位置</div>
                        <div class="analysis-metric-value">${posInRange.toFixed(0)}% / 100%</div>
                    </div>
                </div>
            `;

            // ===== 7. 风险标签渲染 =====
            const riskTagHtml = riskTags.map(t => `<span class="risk-tag ${t.level}">⚠ ${t.text}</span>`).join('');

            return `
                <div class="fund-analysis-toggle" onclick="toggleAnalysis('${fund.code}')">
                    <div class="fund-analysis-toggle-header">
                        <span>📊 专业详细分析</span>
                        <span class="arrow">▾</span>
                    </div>
                    <div class="fund-analysis-body">
                        <div class="analysis-section">
                            <div class="analysis-section-title"><span class="bullet"></span>市场环境</div>
                            <div class="analysis-section-text">${marketEnv}</div>
                        </div>
                        <div class="analysis-section">
                            <div class="analysis-section-title"><span class="bullet"></span>技术面解读</div>
                            <div class="analysis-section-text">${techAnalysis}</div>
                        </div>
                        <div class="analysis-section">
                            <div class="analysis-section-title"><span class="bullet"></span>关键指标</div>
                            ${metricHtml}
                        </div>
                        <div class="analysis-section">
                            <div class="analysis-section-title"><span class="bullet"></span>操作建议</div>
                            <div class="analysis-section-text">${positionAdvice}</div>
                        </div>
                        <div class="analysis-section">
                            <div class="analysis-section-title"><span class="bullet"></span>风险提示</div>
                            <div>${riskTagHtml}</div>
                            <div class="analysis-section-text" style="margin-top:6px;">${riskTips}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 展开/收起专业详细分析
        function toggleAnalysis(fundCode) {
            const toggle = document.querySelector(`#fund-card-${fundCode} .fund-analysis-toggle`);
            if (toggle) toggle.classList.toggle('open');
        }

        // 渲染指数历史 - 柱状图（每日涨跌幅）+ 收盘价折线叠加
        function renderIndexHistory() {
            const container = document.getElementById('indexHistoryRows');
            const history = indexData.history || [];
            if (history.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:10px;font-size:12px;color:var(--text-muted);">暂无数据</div>';
                return [];
            }

            // 后端返回为倒序（最新在前），先按日期升序排列
            const ascHistory = [...history].reverse();
            const n = ascHistory.length;

            // 提取数据
            const closes = ascHistory.map(h => h.close);
            const changes = ascHistory.map(h => (typeof h.change === 'number' ? h.change : 0));
            const minV = Math.min(...closes);
            const maxV = Math.max(...closes);
            const range = maxV - minV || 1;

            // 涨跌幅最大绝对值（用于柱状图 Y 缩放），留 15% padding
            const maxAbsChange = Math.max(...changes.map(Math.abs), 0.5) * 1.15;
            // 14 日累计涨跌幅
            const cumChange = changes.reduce((s, x) => s + x, 0);

            const W = 360;
            const H = 150;
            const padL = 32, padR = 12, padT = 18, padB = 22;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const midY = padT + chartH / 2;  // 0% 基准线
            const stepX = n > 1 ? chartW / (n - 1) : 0;
            const barW = Math.max(2, Math.min(8, (chartW / n) * 0.7));

            // === 柱状图坐标（每日涨跌幅）===
            const bars = closes.map((close, i) => {
                const ch = changes[i];
                const x = padL + i * stepX - barW / 2;
                const ratio = ch / maxAbsChange;
                const h = Math.abs(ratio) * (chartH / 2);
                const y = ch >= 0 ? midY - h : midY;
                const color = ch >= 0 ? '#e53935' : '#2e7d32';
                return { x, y, h, color, ch, close, date: ascHistory[i].date, i };
            });

            // === 收盘价折线（淡色叠加）===
            const closePoints = closes.map((v, i) => ({
                x: padL + i * stepX,
                y: padT + chartH - ((v - minV) / range) * chartH,
                v, i
            }));
            const linePath = closePoints.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            const areaPath = linePath +
                ` L${closePoints[n - 1].x.toFixed(1)},${(padT + chartH).toFixed(1)}` +
                ` L${closePoints[0].x.toFixed(1)},${(padT + chartH).toFixed(1)} Z`;

            // === Y 轴刻度（左：涨跌幅 %）===
            const yTicks = [-maxAbsChange, -maxAbsChange / 2, 0, maxAbsChange / 2, maxAbsChange];
            let yLabels = '';
            yTicks.forEach(v => {
                const ratio = v / maxAbsChange;
                const y = midY - ratio * (chartH / 2);
                yLabels += `<line x1="${padL - 3}" y1="${y.toFixed(1)}" x2="${padL}" y2="${y.toFixed(1)}" stroke="var(--text-muted)" stroke-width="0.8"/>`;
                yLabels += `<text x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v > 0 ? '+' : ''}${v.toFixed(1)}</text>`;
                // 0% 横向虚线
                if (v === 0) {
                    yLabels += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="2,2"/>`;
                }
            });

            // === 日期标签（首/中/尾）===
            const dateShowIdx = n > 3 ? [0, Math.floor(n / 2), n - 1] : [0, n - 1];
            const dateLabels = dateShowIdx.map(i => {
                const x = padL + i * stepX;
                return `<text x="${x.toFixed(1)}" y="${(H - 6).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${ascHistory[i].date.slice(5)}</text>`;
            }).join('');

            // === 最高/最低柱标签 ===
            let maxBarIdx = 0, minBarIdx = 0;
            for (let i = 1; i < n; i++) {
                if (changes[i] > changes[maxBarIdx]) maxBarIdx = i;
                if (changes[i] < changes[minBarIdx]) minBarIdx = i;
            }
            const maxBar = bars[maxBarIdx];
            const minBar = bars[minBarIdx];

            // 累计大数字
            const cumSign = cumChange >= 0 ? '+' : '';
            const cumColor = cumChange >= 0 ? '#e53935' : '#2e7d32';

            // 极值柱文字标签
            const maxLabel = `<text x="${(maxBar.x + barW / 2).toFixed(1)}" y="${(maxBar.y - 3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="#e53935">${maxBar.ch >= 0 ? '+' : ''}${maxBar.ch.toFixed(2)}</text>`;
            const minLabel = `<text x="${(minBar.x + barW / 2).toFixed(1)}" y="${(minBar.y + minBar.h + 10).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="#2e7d32">${minBar.ch >= 0 ? '+' : ''}${minBar.ch.toFixed(2)}</text>`;

            container.innerHTML = `
                <div class="index-chart-header" style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;">
                    <span>近${n}天走势</span>
                    <span style="font-size:13px;font-weight:700;color:${cumColor};">累计 ${cumSign}${cumChange.toFixed(2)}%</span>
                </div>
                <div class="index-chart-wrap">
                    <svg class="index-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H + 20}px;">
                        <defs>
                            <linearGradient id="idxCloseArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="rgba(99,102,241,0.10)"/>
                                <stop offset="100%" stop-color="rgba(99,102,241,0.0)"/>
                            </linearGradient>
                        </defs>
                        <!-- Y 轴刻度 + 0% 基准线 -->
                        ${yLabels}
                        <!-- 收盘价折线 + 填充（淡色背景） -->
                        <path d="${areaPath}" fill="url(#idxCloseArea)"/>
                        <path d="${linePath}" fill="none" stroke="rgba(99,102,241,0.6)" stroke-width="1.2" stroke-linejoin="round"/>
                        <!-- 涨跌幅柱状图 -->
                        ${bars.map(b => `<rect x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${barW.toFixed(1)}" height="${b.h.toFixed(1)}" fill="${b.color}" opacity="0.9" rx="1"/>`).join('')}
                        <!-- 极值标签 -->
                        ${maxLabel}
                        ${minLabel}
                        <!-- 日期 -->
                        ${dateLabels}
                    </svg>
                </div>
            `;
            return ascHistory;
        }

        // 渲染 AI 综合分析（每只基金结合市场指数给出当日预估）
        function renderAiSummary() {
            const body = document.getElementById('aiSummaryBody');
            const dateEl = document.getElementById('aiSummaryDate');
            if (!fundData || fundData.length === 0) {
                body.innerHTML = '<div style="padding:10px;text-align:center;font-size:12px;color:var(--text-muted);">数据加载中…</div>';
                return;
            }

            // 组合整体统计
            let totalEstChange = 0, validCount = 0;
            let upCount = 0, downCount = 0, flatCount = 0;
            // 计算组合7日累计收益
            let portfolio7DChange = 0, portfolioCount = 0;
            // === 模拟持仓预估当日盈亏 ===
            // 假设本金 1 万元，平均分配到每只基金；
            // 每只预估持仓 = 10000 / N
            // 每只预估当日盈亏 = 持仓 × est_change%（盘末有 actual 时用 actual）
            const SIMULATED_PRINCIPAL = 10000;  // 模拟本金（元）
            const simulatedPerFund = fundData.length > 0 ? SIMULATED_PRINCIPAL / fundData.length : 0;
            let simulatedProfit = 0;
            for (const f of fundData) {
                const ai = f.aiPrediction;
                const hasEst = ai && typeof ai.est_change === 'number' && Math.abs(ai.est_change) > 0.01;
                const change = hasEst ? ai.est_change : f.dailyChange;
                if (change > 0.01) { upCount++; }
                else if (change < -0.01) { downCount++; }
                else { flatCount++; }
                totalEstChange += change;
                validCount++;
                simulatedProfit += simulatedPerFund * (change / 100);
                if (f.history && f.history.length >= 5) {
                    const changes = f.history.slice(0, 7).map(h => h.change);
                    const accum = changes.reduce((a, b) => a + b, 0);
                    portfolio7DChange += accum;
                    portfolioCount++;
                }
            }
            const avgChange = validCount > 0 ? totalEstChange / validCount : 0;
            const avg7D = portfolioCount > 0 ? portfolio7DChange / portfolioCount : 0;

            // 顶部市场行情摘要（上证指数 + 沪深300）
            const stockIdxChange = indexData.current > 0 ? indexData.dailyChange : 0;
            const hs300IdxChange = hs300IndexData && hs300IndexData.current > 0 ? hs300IndexData.dailyChange : 0;
            const stockSign = stockIdxChange >= 0 ? '+' : '';
            const hs300Sign = hs300IdxChange >= 0 ? '+' : '';
            const stockColor = stockIdxChange > 0.3 ? '#c62828' : (stockIdxChange < -0.3 ? '#2e7d32' : '#555');
            const hs300Color = hs300IdxChange > 0.3 ? '#c62828' : (hs300IdxChange < -0.3 ? '#2e7d32' : '#555');

            // 沪深300指数显示
            let hs300MarketDisplay = '-';
            let hs300MarketLabel = '沪深300';
            let hs300MarketChange = hs300IdxChange;
            if (hs300IdxChange !== 0) {
                hs300MarketDisplay = hs300Sign + hs300IdxChange.toFixed(2) + '%';
            }
            const hs300Label = hs300MarketChange > 0.3 ? 'up' : (hs300MarketChange < -0.3 ? 'down' : 'flat');

            // 判断是否有盘中估算数据（estimated_change 有效）
            let hasTodayEst = false;
            for (const f of fundData) {
                const ai = f.aiPrediction;
                if (ai && typeof ai.est_change === 'number' && Math.abs(ai.est_change) > 0.01) {
                    hasTodayEst = true;
                    break;
                }
            }

            // 数据来源标注
            const dataSourceLabel = hasTodayEst ? '盘中估算' : '最新净值';

            // 整体点评（标注是"盘中估算"还是"最新净值"）
            let overview;
            if (avgChange > 1.0) overview = `📈 ${dataSourceLabel}盘面偏强，组合平均上涨 ${avgChange.toFixed(2)}%（${upCount}/${downCount}）`;
            else if (avgChange > 0.2) overview = `↗️ ${dataSourceLabel}窄幅偏强，组合平均上涨 ${avgChange.toFixed(2)}%（${upCount}/${downCount}）`;
            else if (avgChange < -1.0) overview = `📉 ${dataSourceLabel}盘面偏弱，组合平均下跌 ${Math.abs(avgChange).toFixed(2)}%（${upCount}/${downCount}）`;
            else if (avgChange < -0.2) overview = `↘️ ${dataSourceLabel}窄幅偏弱，组合平均下跌 ${Math.abs(avgChange).toFixed(2)}%（${upCount}/${downCount}）`;
            else overview = `〰️ ${dataSourceLabel}震荡整理（${upCount}/${downCount}/${flatCount}）`;

            // 日期显示逻辑：有盘中估算数据时显示"盘中估算"，否则显示最新净值日期
            if (hasTodayEst) {
                // 有盘中估算数据时
                dateEl.textContent = '盘中估算';
            } else {
                // 无盘中估算时，显示最新净值日期
                let latestDate;
                const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
                
                if (fundData && fundData.length > 0) {
                    latestDate = fundData[0].navDate || '';
                }
                
                if (!latestDate || latestDate === '未知') {
                    if (indexData.history && indexData.history.length > 0) {
                        latestDate = indexData.history[0].date;
                    } else if (fundData && fundData.length > 0 && fundData[0].history && fundData[0].history.length > 0) {
                        latestDate = fundData[0].history[0].date;
                    } else {
                        latestDate = todayStr;
                    }
                }
                
                if (latestDate !== todayStr) {
                    dateEl.textContent = `${latestDate}（最新净值）`;
                } else {
                    dateEl.textContent = latestDate;
                }
            }

            // 每只基金的详细分析（纯市场视角，卡片式分行）
            const bondIdxChange = bondIndexData.current > 0 ? bondIndexData.dailyChange : 0;

            const fundCards = fundData.map(fund => {
                const ai = fund.aiPrediction || {};
                const typeLower = (fund.type || '').toLowerCase();
                const isBond = typeLower.includes('债');
                // 债券基金涨跌幅极小，放宽预估判断门槛
                const estThreshold = isBond ? 0.001 : 0.01;
                const hasValidEst = typeof ai.est_change === 'number' && Math.abs(ai.est_change) >= estThreshold && ai.est_nav > 0;
                // === 残差修正：优先用后端修正后的估值 ===
                const correctionEnabled = fund.correction_confidence && fund.correction_confidence !== 'none' && fund.correction_sample_count >= 3;
                const correctedChange = (typeof fund.corrected_estimated_change === 'number' && correctionEnabled && hasValidEst)
                    ? fund.corrected_estimated_change
                    : ai.est_change;
                // === 是否拥有"今日已收盘"的实际值 ===
                // 盘中（< 15:00）或 navDate 不是今天 → dailyChange 仍是昨日 actual，不应作为"今日实际"对比
                const _now = new Date();
                const _todayStr = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
                const _isWeekend = _now.getDay() === 0 || _now.getDay() === 6;
                const hasActual = typeof fund.dailyChange === 'number' && fund.dailyChange !== 0 && fund.navDate === _todayStr && !_isWeekend;
                // 优先用模型估值（如有），其次 残差修正后 gsz
                const hasModel = fund.model_type && fund.model_type !== 'residual_only'
                    && typeof fund.model_estimated_change === 'number' && fund.model_estimated_change !== 0;
                // 主显示优先级：永远用「预估/模型」，不切到 actual
                // - 盘中（hasValidEst）→ 残差修正后 gsz
                // - 盘末（est_cache 锁定 15:00 那一刻的估算值）→ gsz 显示该锁定值
                // - 周末/节假日（无 gsz）→ 模型估值（如有）或 0
                // 用户原则：预估永远是预估，不等于净值
                let mainChange, mainTag;
                if (hasValidEst) {
                    mainChange = correctedChange;
                    mainTag = '预估';
                } else if (hasModel) {
                    mainChange = fund.model_estimated_change;
                    mainTag = '模型';
                } else {
                    mainChange = 0;
                    mainTag = '无';
                }
                const estChange = mainChange;
                const estSign = estChange >= 0 ? '+' : '';
                const estNav = (ai.est_nav && ai.est_nav > 0) ? ai.est_nav : fund.currentNav;
                // 修正系数显示数据
                const corrOffset = (typeof fund.correction_offset === 'number' && correctionEnabled) ? fund.correction_offset : 0;
                const corrSamples = fund.correction_sample_count || 0;
                const corrConfidence = fund.correction_confidence || 'none';
                const corrStd = (typeof fund.correction_std === 'number' && correctionEnabled) ? fund.correction_std : 0;
                // 颜色判断：债券阈值放宽到 0.001，股票保持 0.01
                const colorThreshold = isBond ? 0.001 : 0.01;
                const changeClass = estChange > colorThreshold ? 'up' : (estChange < -colorThreshold ? 'down' : 'flat');

                // 基金类型 - 匹配市场指数（isBond已在上方定义）
                const relatedIndexName = isBond ? '国债指数' : '上证指数';
                const relatedChange = isBond ? bondIdxChange : stockIdxChange;
                const rSign = relatedChange >= 0 ? '+' : '';
                const rClass = relatedChange > 0.1 ? 'up' : (relatedChange < -0.1 ? 'down' : 'flat');
                const relatedChangeStr = relatedChange !== 0 ? rSign + relatedChange.toFixed(2) + '%' : '-';

                // 7日累计收益
                let week7Change = 0;
                if (fund.history && fund.history.length > 0) {
                    const slice = fund.history.slice(0, 7);
                    week7Change = slice.reduce((sum, h) => sum + h.change, 0);
                }
                const week7Sign = week7Change >= 0 ? '+' : '';
                const week7Class = week7Change > 0.1 ? 'up' : (week7Change < -0.1 ? 'down' : 'flat');

                // 连涨/连跌
                let consecDays = 0, consecType = '', consecShow = '';
                if (fund.history && fund.history.length > 0) {
                    const lastDir = fund.history[0].change >= 0 ? 'up' : 'down';
                    for (const h of fund.history) {
                        const d = h.change >= 0 ? 'up' : 'down';
                        if (d === lastDir && Math.abs(h.change) > 0.01) consecDays++;
                        else break;
                    }
                    consecType = lastDir === 'up' ? '连涨' : '连跌';
                    if (consecDays > 1) consecShow = `${consecType}${consecDays}天`;
                }

                // 建议和趋势信息
                const advice = ai.advice || '数据有限，持续观察';
                const confidence = ai.confidence || '';
                const trend = ai.trend || '';
                const trendEmoji = ai.trend_emoji || '•';

                // 副标行：gsz vs 模型 对比（actual 仅作模型偏差参考，不单独显示）
                let subTags = '';
                const gszVal = (typeof ai.est_change === 'number') ? ai.est_change : 0;
                const gszHasVal = Math.abs(gszVal) >= estThreshold && ai.est_nav > 0;
                const modelVal = (typeof fund.model_estimated_change === 'number') ? fund.model_estimated_change : 0;
                const modelHasVal = hasModel && Math.abs(modelVal) >= 0.001;
                const actualVal = fund.dailyChange || 0;
                if (gszHasVal) {
                    subTags += `<span class="ai-fund-tag ai-fund-gsz">gsz ${gszVal >= 0 ? '+' : ''}${gszVal.toFixed(2)}%</span>`;
                }
                if (modelHasVal) {
                    // 把 actual 作为"模型偏差"显示在模型 chip 后，不单独显示 actual chip
                    const modelErr = hasActual ? (modelVal - actualVal) : null;
                    const errClass = modelErr !== null ? (modelErr >= 0 ? 'ai-fund-err err-pos' : 'ai-fund-err err-neg') : '';
                    const errStr = modelErr !== null ? ` <span class="${errClass}">vs实际${modelErr>=0?'+':''}${modelErr.toFixed(2)}%</span>` : '';
                    const tick = hasActual && Math.abs(modelErr) < 0.05 ? ' ✓' : '';
                    subTags += `<span class="ai-fund-tag ai-fund-model">模型 ${modelVal >= 0 ? '+' : ''}${modelVal.toFixed(2)}%${errStr}${tick}</span>`;
                }
                if (!gszHasVal && !modelHasVal) {
                    subTags = `<span class="ai-fund-tag" style="opacity:0.6;">无数据</span>`;
                }

                // === 动态提示：只生成有价值的提示，不显示固定文案 ===
                let dynamicHint = '';
                const mStd = (typeof fund.model_std === 'number') ? fund.model_std : 0;
                const mSamples = (typeof fund.model_sample_count === 'number') ? fund.model_sample_count : 0;
                const mConf = fund.model_confidence || 'none';
                const mOffset = (typeof fund.model_offset === 'number') ? fund.model_offset : 0;
                // 规则1：有 actual + 有模型 → 偏差提示
                if (hasActual && hasModel) {
                    const err = Math.abs(modelVal - actualVal);
                    if (err < 0.1) {
                        dynamicHint = `✓ 模型准确（偏差${(modelVal-actualVal)>=0?'+':''}${(modelVal-actualVal).toFixed(2)}%）`;
                    } else if (err < 0.3) {
                        dynamicHint = `模型偏差${(modelVal-actualVal)>=0?'+':''}${(modelVal-actualVal).toFixed(2)}%，仍可参考`;
                    } else {
                        dynamicHint = `⚠️ 模型偏差较大（${(modelVal-actualVal)>=0?'+':''}${(modelVal-actualVal).toFixed(2)}%），市场异常或样本不足`;
                    }
                }
                // 规则2：无 actual + 有模型 → 预测区间
                else if (!hasActual && hasModel) {
                    if (mStd > 0) {
                        const lo = (modelVal - mStd).toFixed(2);
                        const hi = (modelVal + mStd).toFixed(2);
                        dynamicHint = `模型预测区间 [${lo}%, ${hi}%] (σ=${mStd.toFixed(3)}%)`;
                    } else {
                        dynamicHint = `模型预测 ${modelVal >= 0 ? '+' : ''}${modelVal.toFixed(2)}%`;
                    }
                }
                // 规则3：仅 gsz，无 actual 无模型 → 数据来源
                else if (gszHasVal && !hasActual && !hasModel) {
                    const estDate = (ai.est_time || '').substring(0, 10);
                    const now = new Date();
                    const isWeekend = now.getDay() === 0 || now.getDay() === 6;
                    if (isWeekend && estDate && estDate !== now.toISOString().substring(0, 10)) {
                        dynamicHint = `gsz 来源：${estDate} 收盘`;
                    }
                }
                // 规则4：仅 actual，无 gsz 无模型（罕见）→ 跳过
                // 规则5：残差学习中提示（需 ≥3 样本但还差几个）
                if (!dynamicHint && mSamples > 0 && mSamples < 3 && hasModel) {
                    dynamicHint = `📐 残差学习中（${mSamples}/3 样本，置信度低）`;
                }
                // 规则6：债基特殊提示（5日均值基线 + σ 区间）
                if (!dynamicHint && isBond && typeof fund.model_estimated_change === 'number' && fund.model_benchmark_name) {
                    dynamicHint = `债基预测基于 ${fund.model_benchmark_name}`;
                }

                // === 高级分析提示（叠加在基础提示之上，按优先级取最强信号）===
                let advancedHint = '';
                // 信号1：跑赢/跑输基准 alpha（仅股票基金，model + actual 都存在时）
                if (!isBond && hasActual && hasModel && fund.model_benchmark_change !== 0) {
                    const idxChange = fund.model_benchmark_change;
                    const alpha = actualVal - idxChange;
                    if (Math.abs(alpha) > 0.3) {
                        advancedHint = alpha > 0
                            ? `🎯 跑赢基准 ${idxChange} ${alpha.toFixed(2)}% · alpha 显著`
                            : `📉 跑输基准 ${idxChange} ${Math.abs(alpha).toFixed(2)}% · 基金拖后腿`;
                    }
                }
                // 信号2：方向一致性（model 方向 vs gsz 方向 vs 5日趋势）
                if (!advancedHint && hasModel && gszHasVal && fund.history && fund.history.length >= 3) {
                    const modelDir = modelVal >= 0 ? 1 : -1;
                    const gszDir = gszVal >= 0 ? 1 : -1;
                    const recent5 = fund.history.slice(0, 5);
                    const trendSum = recent5.reduce((s, h) => s + h.change, 0);
                    const trendDir = trendSum >= 0 ? 1 : -1;
                    if (modelDir === gszDir && gszDir === trendDir) {
                        advancedHint = `🎯 三方看${modelDir > 0 ? '涨' : '跌'} · 信号一致（模型/gsz/5日趋势）`;
                    } else if (modelDir === gszDir) {
                        advancedHint = `🔀 模型↔gsz ${modelDir > 0 ? '涨' : '跌'}，5日趋势反向 · 短期回调？`;
                    } else {
                        advancedHint = `⚡ 模型${modelDir > 0 ? '看涨' : '看跌'} vs gsz${gszDir > 0 ? '看涨' : '看跌'} · 信号分歧，谨慎`;
                    }
                }
                // 信号3：自学习价值（残差修正带来的偏差改善）
                if (!advancedHint && hasActual && hasModel && correctionEnabled && fund.correction_offset) {
                    const rawErr = Math.abs(gszVal - actualVal);
                    const correctedEst = gszVal + fund.correction_offset;
                    const correctedErr = Math.abs(correctedEst - actualVal);
                    const improve = rawErr - correctedErr;
                    if (improve > 0.05) {
                        advancedHint = `📐 残差修正让偏差从 ${rawErr.toFixed(2)}% 降至 ${correctedErr.toFixed(2)}%（提升 ${improve.toFixed(2)}%）`;
                    } else if (correctedErr < 0.05) {
                        advancedHint = `📐 残差修正后模型 ${correctedEst >= 0 ? '+' : ''}${correctedEst.toFixed(2)}%，已与 actual 高度一致`;
                    }
                }
                // 信号4：gsz 异常预警（绝对值 > 3%）
                if (!advancedHint && gszHasVal && Math.abs(gszVal) > 3) {
                    advancedHint = `🚨 gsz 估值 ${gszVal >= 0 ? '+' : ''}${gszVal.toFixed(2)}% 异常波动，关注市场`;
                }
                // 信号5：模型置信度变化
                if (!advancedHint && mConf === 'high' && mSamples >= 5 && hasModel) {
                    advancedHint = `🔥 模型已稳定（${mSamples}样本·高置信），可作为决策参考`;
                }
                // 信号6：5日连续同向（顺势）
                if (!advancedHint && fund.history && consecDays >= 4) {
                    advancedHint = `📈 ${consecShow} · 趋势${consecType === '连涨' ? '向上' : '向下'}，注意反转风险`;
                }

                // 合并：高级提示优先，若 dynamicHint 不存在则用基础；都为空则不显示
                const finalHint = advancedHint || dynamicHint;

                return `
                    <div class="ai-fund-card">
                        <div class="ai-fund-row">
                            <div class="ai-fund-name">${fund.code} · ${fund.name}</div>
                            <div class="ai-fund-trend">${trendEmoji} ${trend} · 置信度 ${confidence}</div>
                            <div class="ai-fund-change ${changeClass}">${estSign}${estChange.toFixed(2)}%${mainTag ? `<span style="font-size:10px;margin-left:4px;opacity:0.7;">${mainTag}</span>` : ''}</div>
                        </div>
                        <div class="ai-fund-subrow">
                            <div class="ai-fund-nav">预估净值 ¥${estNav.toFixed(4)}</div>
                            <div class="ai-fund-tags">
                                <span class="ai-fund-tag index-tag ${rClass}">
                                    ${relatedIndexName} ${relatedChangeStr}
                                </span>
                                ${subTags}
                                <span class="ai-fund-tag ${week7Class}">近14日 ${week7Sign}${week7Change.toFixed(2)}%</span>
                                ${consecShow ? `<span class="ai-fund-tag ${consecType==='连涨'?'up':'down'}">${consecShow}</span>` : ''}
                            </div>
                        </div>
                        ${finalHint ? `<div class="ai-fund-est-hint">${finalHint}</div>` : ''}
                        ${(() => {
                            // === 基金专属模型 chip：每只基金唯一 ===
                            // 1) 有专用模型（指数跟随/多因子/债基基线）→ 只显示 📊 紫色 chip
                            // 2) 无专用模型（residual_only）→ 只显示 🧮 残差修正 chip
                            const mt = fund.model_type || 'residual_only';
                            const mBenchName = fund.model_benchmark_name || '';
                            const mBench = (typeof fund.model_benchmark_change === 'number') ? fund.model_benchmark_change : 0;
                            const mEst = (typeof fund.model_estimated_change === 'number') ? fund.model_estimated_change : 0;
                            const mEnabled = fund.model_enabled;
                            const mSamples = fund.model_sample_count || 0;
                            const mOffset = (typeof fund.model_offset === 'number') ? fund.model_offset : 0;
                            const mConf = fund.model_confidence || 'none';
                            const mSign = mEst >= 0 ? '+' : '';
                            const mBenchSign = mBench >= 0 ? '+' : '';
                            if (mt === 'residual_only') {
                                // 普通基金：只显示残差修正（gsz 残差）
                                return correctionEnabled
                                    ? `<div class="ai-fund-corr-chip" title="基于${corrSamples}个交易日 gsz 残差均值修正｜波动σ=${corrStd.toFixed(3)}%">🧮 gsz残差修正 ${corrOffset>=0?'+':''}${corrOffset.toFixed(3)}% · ${corrSamples}样本 · 置信度${corrConfidence==='high'?'高':corrConfidence==='medium'?'中':'低'}</div>`
                                    : `<div class="ai-fund-corr-chip disabled" title="积累≥3个交易日 gsz 残差后自动启用">🧮 gsz残差学习中（${corrSamples}/3 样本）</div>`;
                            }
                            // 专用模型：显示紫色 chip，每只基金 tag 不一样
                            let tag = '';
                            let titleExtra = '';
                            let subInfo = '';
                            if (mt === 'index_following') {
                                tag = '指数跟随';
                                titleExtra = mEnabled
                                    ? `｜残差${mOffset>=0?'+':''}${mOffset.toFixed(3)}%（${mSamples}样本）· 置信度${mConf==='high'?'高':mConf==='medium'?'中':'低'}`
                                    : `｜残差学习中（${mSamples}样本，需≥3启用）`;
                                subInfo = ` · 基准${mBenchName} ${mBenchSign}${mBench.toFixed(2)}%`;
                            } else if (mt === 'multi_factor') {
                                tag = '多因子加权';
                                titleExtra = mEnabled
                                    ? `｜回归残差${mOffset>=0?'+':''}${mOffset.toFixed(3)}%（${mSamples}样本）· 置信度${mConf==='high'?'高':mConf==='medium'?'中':'低'}`
                                    : `｜回归学习中`;
                                subInfo = ` · 加权${mBenchName} ${mBenchSign}${mBench.toFixed(2)}%`;
                            } else if (mt === 'bond_baseline') {
                                tag = '债基基线';
                                subInfo = ` · ${mBenchName || '5日均值趋势'}`;
                                titleExtra = '｜5日滚动均值 + gsz残差（债基波动小，置信度天然高）';
                            }
                            return `<div class="ai-fund-corr-chip" style="background:rgba(99,102,241,0.10);color:#6366f1;border:1px solid rgba(99,102,241,0.30);" title="基于${tag}模型：${titleExtra}">📊 ${tag} ${mSign}${mEst.toFixed(3)}%${subInfo}</div>`;
                        })()}
                        <div class="ai-fund-advice">${advice}</div>
                    </div>
                `;
            }).join('');

            // 市场行情区（三列）
            const stockIdxV = stockIdxChange;
            const stockLabel = stockIdxV > 0.3 ? 'up' : (stockIdxV < -0.3 ? 'down' : 'flat');
            const portLabel = avg7D > 0.3 ? 'up' : (avg7D < -0.3 ? 'down' : 'flat');

            body.innerHTML = `
                <div class="ai-market-summary">
                    <div class="ai-market-item">
                        <div class="ai-market-label">上证指数</div>
                        <div class="ai-market-value ${stockLabel}">${stockSign}${stockIdxV.toFixed(2)}%</div>
                    </div>
                    <div class="ai-market-item">
                        <div class="ai-market-label">${hs300MarketLabel}</div>
                        <div class="ai-market-value ${hs300Label}">${hs300MarketDisplay}</div>
                    </div>
                    <div class="ai-market-item">
                        <div class="ai-market-label">组合近14日</div>
                        <div class="ai-market-value ${portLabel}">${avg7D>=0?'+':''}${avg7D.toFixed(2)}%</div>
                    </div>
                    <div class="ai-market-item" title="假设本金 1 万元平均分配到 ${fundData.length} 只基金的当日预估盈亏">
                        <div class="ai-market-label">模拟盈亏(1万)</div>
                        <div class="ai-market-value ${simulatedProfit > 0.5 ? 'up' : (simulatedProfit < -0.5 ? 'down' : 'flat')}">${simulatedProfit >= 0 ? '+' : ''}${simulatedProfit.toFixed(2)}元</div>
                    </div>
                </div>
                <div class="ai-summary-overview">${overview}</div>
                <div class="ai-fund-section-title">基金分析（${fundData.length}只）</div>
                ${fundCards}
            `;
        }

        // 渲染基金状态总览
        function renderFundSummary() {
            const container = document.getElementById('fundSummaryList');
            if (fundData.length === 0) {
                container.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:12px;">暂无数据</div>';
                return;
            }
            container.innerHTML = fundData.map(fund => {
                const bp = fund.buyPoint || {
                    cost_nav: fund.currentNav, yield_pct: 0, can_buy: false, is_holding: false,
                    hold_days: 0, drop_pct: 0, hist_yield: 0, buy_point_yield: -3.0,
                    target_nav: fund.currentNav, progress_pct: 0
                };
                const yieldPct = bp.yield_pct;
                const yieldSign = yieldPct >= 0 ? '+' : '';
                const isHolding = bp.is_holding === true;
                const canBuy = bp.can_buy === true && !isHolding;

                // 买点进度：完全信任后端返回的 progress_pct（0–100）
                // 后端新规则已按"价格距离"精确计算：(ref_nav − current_nav) / (ref_nav − target_nav) × 100
                let progress = (typeof bp.progress_pct === 'number' && !isNaN(bp.progress_pct)) ? bp.progress_pct : 0;
                if (canBuy) progress = 100;
                // （历史兼容逻辑已移除，避免硬编码 3.0 与实际阈值不一致导致显示错误）
                // 进度 0–33% 一律显示蓝色（远离买点），避免出现"空进度条却是绿色"
                let progressClass = 'low';
                if (progress >= 100) progressClass = 'ready';
                else if (progress >= 66) progressClass = 'high';
                else if (progress >= 33) progressClass = 'mid';

                // 当前收益率 vs 买点阈值（仅未持仓展示）
                const bpYield = (typeof bp.buy_point_yield === 'number') ? bp.buy_point_yield : -3.0;
                const targetNav = (typeof bp.target_nav === 'number') ? bp.target_nav : bp.cost_nav;
                const dropPct = (typeof bp.drop_pct === 'number') ? bp.drop_pct : 0;

                // 状态标签
                let statusLabel, tagClass, statusDesc;
                if (isHolding) {
                    statusLabel = `持有中 ${bp.hold_days || 0}天`;
                    tagClass = 'holding';
                    statusDesc = `成本 ¥${bp.cost_nav.toFixed(4)} · 持有收益 ${yieldSign}${yieldPct.toFixed(2)}%`;
                } else if (canBuy) {
                    statusLabel = '可买入';
                    tagClass = 'can-buy';
                    statusDesc = `买点阈值 ${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}%`;
                } else if (progress >= 66) {
                    statusLabel = '接近买点';
                    tagClass = 'waiting';
                    statusDesc = `买点阈值 ${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}% · 还差 ${dropPct.toFixed(2)}%`;
                } else if (progress >= 33) {
                    statusLabel = '观望中';
                    tagClass = 'waiting';
                    statusDesc = `买点阈值 ${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}%`;
                } else {
                    statusLabel = '持续观望';
                    tagClass = 'waiting';
                    statusDesc = `买点阈值 ${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}%`;
                }

                let yieldClass = 'zero';
                if (yieldPct > 0) yieldClass = 'positive';
                else if (yieldPct < 0) yieldClass = 'negative';

                // 右侧的收益率标签：已持仓显示"持有收益"，未持仓显示"买点阈值"
                const rightYieldLabel = isHolding ? '持有收益' : '买点阈值';
                const rightYieldValue = isHolding ? `${yieldSign}${yieldPct.toFixed(2)}%` : `${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}%`;
                const targetLine = !isHolding ? `<div style="font-size:10px;color:var(--text-muted);">目标 ¥${targetNav.toFixed(4)}</div>` : '';

                return `
                    <div class="fund-summary-item">
                        <div class="fund-summary-left">
                            <div class="fund-summary-name">${fund.name}</div>
                            <div class="fund-summary-code">${fund.code}${fund.buy_point_ref_date ? ` <span style="font-size:10px;color:var(--text-muted);">${fund.buy_point_ref_date}</span>` : ''}</div>
                        </div>
                        <div class="fund-summary-center">
                            <div class="fund-summary-yield ${yieldClass}">${yieldSign}${yieldPct.toFixed(2)}%</div>
                            ${isHolding ? '' : `
                            <div class="buy-progress-wrap">
                                <div class="buy-progress-label">
                                    <span>买点进度</span>
                                    <span>${progress.toFixed(0)}%</span>
                                </div>
                                <div class="buy-progress-track">
                                    <div class="buy-progress-fill ${progressClass}" style="width:${progress.toFixed(0)}%"></div>
                                </div>
                                <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">
                                    ${dropPct > 0 ? `还差 ${dropPct.toFixed(2)}% · ` : ''}阈值 ${bpYield >= 0 ? '+' : ''}${bpYield.toFixed(2)}%
                                </div>
                            </div>
                            `}
                            ${isHolding ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">${statusDesc}</div>` : ''}
                        </div>
                        <div class="fund-summary-right">
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                                <span class="fund-summary-tag ${tagClass}">${statusLabel}</span>
                                <div style="display:flex;gap:3px;align-items:center;">
                                    <span style="font-size:10px;color:var(--text-muted);">${rightYieldLabel}</span>
                                    <span class="right-yield-value">${rightYieldValue}</span>
                                </div>
                                ${targetLine}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 模型准确性：调用后端 /api/model-accuracy 显示每只基金的 MAE、胜率、累计残差
        function renderModelAccuracy() {
            const body = document.getElementById('accuracyBody');
            const periodEl = document.getElementById('accuracyPeriod');
            const card = document.getElementById('accuracyCard');
            if (!body) return;
            // 确保卡片始终可见
            if (card) card.style.display = '';

            const codes = ['011609', '004746', '020741'];
            const modelNames = {
                '011609': '指数跟随',
                '004746': '多因子',
                '020741': '债基基线'
            };

            // 渲染单只基金行（n_samples = 0 时显示"无样本"占位）
            function renderRows(data) {
                return codes.map(code => {
                    const d = data[code] || {};
                    const n = d.sample_count || 0;
                    if (n === 0) {
                        return `<div class="accuracy-item">
                            <div class="acc-info">
                                <span class="acc-code">${code}</span>
                                <span class="acc-model">${modelNames[code]}</span>
                            </div>
                            <div class="acc-metrics">
                                <span class="acc-metric-val" style="color:#999;">—</span>
                            </div>
                            <span class="acc-tag none">无样本</span>
                        </div>`;
                    }
                    // 评价：MAE + 方向胜率
                    const mae = d.mae;
                    const dir = d.direction_accuracy;
                    let level = 'none', label = '—';
                    if (n < 3) {
                        level = 'none'; label = '学习中';
                    } else if (mae < 0.20 && dir >= 80) {
                        level = 'good'; label = '优';
                    } else if (mae < 0.50 && dir >= 60) {
                        level = 'mid'; label = '良';
                    } else {
                        level = 'bad'; label = '弱';
                    }
                    // MAE 颜色
                    const maeClass = mae < 0.30 ? 'good' : (mae < 0.80 ? 'mid' : 'bad');
                    // 残差均值：偏差方向（正=高估跌幅/低估涨幅）
                    const bias = d.mean_residual;
                    const biasClass = Math.abs(bias) < 0.15 ? 'good' : (Math.abs(bias) < 0.40 ? 'mid' : 'bad');
                    const biasSign = bias > 0 ? '+' : '';
                    return `<div class="accuracy-item">
                        <div class="acc-info">
                            <span class="acc-code">${code}</span>
                            <span class="acc-model">${modelNames[code]}</span>
                        </div>
                        <div class="acc-metrics">
                            <div class="acc-metric">
                                <span class="acc-metric-label">MAE</span>
                                <span class="acc-metric-val ${maeClass}">${(mae * 100).toFixed(2)}%</span>
                            </div>
                            <div class="acc-metric">
                                <span class="acc-metric-label">方向</span>
                                <span class="acc-metric-val">${dir.toFixed(0)}%</span>
                            </div>
                            <div class="acc-metric">
                                <span class="acc-metric-label">偏差</span>
                                <span class="acc-metric-val ${biasClass}">${biasSign}${(bias * 100).toFixed(2)}%</span>
                            </div>
                        </div>
                        <span class="acc-tag ${level}">${label}</span>
                    </div>`;
                }).join('');
            }

            // 先渲染占位（保证卡片始终有内容）
            body.innerHTML = `<div class="accuracy-list">${renderRows({})}</div>
                <div class="accuracy-detail">
                    <div class="accuracy-detail-row"><span>MAE：平均绝对误差 · 方向：预测方向正确率 · 偏差：残差均值（+ 高估/- 低估）</span></div>
                </div>`;
            if (periodEl) periodEl.textContent = '近 7 日 · 加载中';

            // 异步加载真实数据
            fetch('/api/model-accuracy?days=7')
                .then(r => r.json())
                .then(data => {
                    body.innerHTML = `<div class="accuracy-list">${renderRows(data)}</div>
                        <div class="accuracy-detail">
                            <div class="accuracy-detail-row"><span>MAE：平均绝对误差 · 方向：预测方向正确率 · 偏差：残差均值（+ 高估/- 低估）</span></div>
                        </div>`;
                    if (periodEl) {
                        const totalSamples = codes.reduce((s, c) => s + (data[c]?.sample_count || 0), 0);
                        periodEl.textContent = `近 7 日 · ${totalSamples} 样本`;
                    }
                })
                .catch(err => {
                    console.error('model-accuracy 加载失败:', err);
                    // 失败时保留占位，不清空
                });
        }

        // 渲染历史收益基准
        function renderHistoricalYields() {
            const container = document.getElementById('historicalYieldList');
            const dateEl = document.getElementById('historicalYieldDate');
            const funds = {
                "011609": "易方达上证科创50联接C",
                "020741": "华泰保兴安悦债券C",
                "004746": "易方达上证50增强C"
            };
            
            // 获取一个有效的日期显示在标题后面
            let commonDate = '';
            for (const code of Object.keys(funds)) {
                const histData = historicalYieldsData[code];
                if (histData && typeof histData === 'object' && histData.date) {
                    commonDate = histData.date;
                    break;
                }
            }
            dateEl.textContent = commonDate || '';
            
            container.innerHTML = Object.entries(funds).map(([code, name]) => {
                const histData = historicalYieldsData[code];
                const yieldValue = histData ? (typeof histData === 'object' ? histData.yield : histData) : 0;
                const sign = yieldValue >= 0 ? '+' : '';
                let valueClass = 'neutral';
                if (yieldValue > 0) valueClass = 'positive';
                else if (yieldValue < 0) valueClass = 'negative';
                return `
                    <div class="historical-yield-row">
                        <span class="historical-yield-code">${code}</span>
                        <span class="historical-yield-name">${name}</span>
                        <span class="historical-yield-value ${valueClass}">${sign}${yieldValue.toFixed(2)}%</span>
                    </div>
                `;
            }).join('');
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 深色模式：开关即真理
            // 60s 检查时只做"开关位置 = UI 状态"的同步校验，不主动按时间改
            function autoDarkMode() {
                // 当前 body class 状态即 UI 状态，开关位置由 CSS 跟随
                // 此函数保留为扩展点（如将来需要定时任务）
                // 当前不做任何主动修改
                return;
            }
            autoDarkMode();
            // 每分钟执行一次（占位，当前不主动改 UI）
            setInterval(autoDarkMode, 60000);

            renderIndex();
            renderAiSummary();
            renderModelAccuracy();
            renderFundSummary();
            renderHistoricalYields();
            renderFundList();
            await refreshData();
            updateTime();
            setInterval(updateTime, 60000);

            // === 30s 自动轮询：PORTFOLIO_CACHE 30s TTL 过期后触发 4.6s 真拉取 ===
            // 30s 内重复请求走 0s 缓存；30s 后才拉一次新数据（4.6s）
            // 下拉刷新手势会带 force=true 立即拉，覆盖这个轮询
            setInterval(() => {
                // 页面隐藏时跳过（避免后台浪费资源）
                if (document.hidden) return;
                refreshData(false);
            }, 30000);

            // === 下拉刷新手势监听 ===
            initPullToRefresh();
        });

        // ============= 下拉刷新 =============
        let pullStartY = 0;
        let pulling = false;
        let pullTriggered = false;
        const PULL_THRESHOLD = 60;   // 触发刷新的下拉距离阈值（px）
        const PULL_MAX = 140;        // 指示器最大下拉距离

        function initPullToRefresh() {
            const indicator = document.getElementById('pullIndicator');
            const pullText = document.getElementById('pullText');
            const spinnerEl = indicator ? indicator.querySelector('.spinner') : null;
            if (!indicator) return;

            // 用 passive: false 才能 preventDefault 阻止原生滚动
            document.addEventListener('touchstart', (e) => {
                if (window.scrollY > 5) { pulling = false; return; }  // 页面不在顶部就不接管
                pullStartY = e.touches[0].clientY;
                pulling = true;
                pullTriggered = false;
                indicator.style.transition = 'none';
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!pulling) return;
                const dy = e.touches[0].clientY - pullStartY;
                if (dy <= 0) {
                    indicator.style.transform = 'translateY(-100%)';
                    return;
                }
                // 阻力递减：拉得越远越费力
                const damped = Math.min(PULL_MAX, dy * 0.45);
                indicator.style.transform = `translateY(${damped - 76}px)`;
                const isReady = damped >= PULL_THRESHOLD;
                // 切换 ready 状态：变色 + 反转箭头 + spinner 加速
                if (isReady && !indicator.classList.contains('ready')) {
                    indicator.classList.add('ready');
                    pullText.textContent = '释放刷新';
                    if (navigator.vibrate) navigator.vibrate(15);
                } else if (!isReady && indicator.classList.contains('ready')) {
                    indicator.classList.remove('ready');
                    pullText.textContent = '下拉刷新';
                } else if (!isReady) {
                    pullText.textContent = '下拉刷新';
                }
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (!pulling) return;
                pulling = false;
                const dy = (e.changedTouches[0].clientY - pullStartY) * 0.45;
                indicator.style.transition = 'transform 0.25s ease';
                if (dy >= PULL_THRESHOLD) {
                    // 触发刷新
                    pullTriggered = true;
                    indicator.classList.add('show');
                    indicator.classList.add('loading');
                    indicator.style.transform = 'translateY(0)';
                    pullText.textContent = '刷新中...';
                    // 强震一下确认触发
                    if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
                    // 调 refreshData(force=true) 绕过 30s 缓存
                    refreshData(true).then(() => {
                        pullText.textContent = '刷新完成';
                        setTimeout(() => {
                            // 收回指示器：classList.remove 后必须清掉 inline transform，
                            // 否则 inline style 优先级最高，元素会卡在 translateY(0)
                            indicator.classList.remove('show');
                            indicator.classList.remove('ready');
                            indicator.classList.remove('loading');
                            indicator.style.transform = 'translateY(-100%)';
                            spinnerEl.style.animationPlayState = 'paused';
                            setTimeout(() => {
                                pullText.textContent = '下拉刷新';
                                spinnerEl.style.animationPlayState = 'running';
                            }, 300);
                        }, 600);
                    });
                } else {
                    indicator.classList.remove('show');
                    indicator.classList.remove('ready');
                    indicator.style.transform = 'translateY(-100%)';
                    pullText.textContent = '下拉刷新';
                }
            }, { passive: true });
        }
    </script>

    <!-- 自定义价格确认弹框 -->
    <div class="modal-overlay" id="priceModal">
        <div class="modal-box">
            <div class="modal-header" id="modalTitle">确认买入</div>
            <div class="modal-body">
                <div class="modal-fund-name" id="modalFundName">—</div>
                <div class="modal-label">成本价（可修改）</div>
                <input type="number" class="modal-input" id="modalPriceInput" step="0.0001" min="0">
                <div class="modal-hint" id="modalHint">点击数值可直接编辑</div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancelBtn">取消</button>
                <button class="modal-btn confirm" id="modalConfirmBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- 自定义结果提示弹框 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <div class="modal-header" id="resultTitle">✅ 操作成功</div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button class="modal-btn confirm" id="resultOkBtn">好的</button>
            </div>
        </div>
    </div>

</body>
